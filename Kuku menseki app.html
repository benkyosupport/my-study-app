<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>九九・面積体感学習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:            #EEF4FB;
    --ink:           #2B3A4A;
    --ink-soft:      #64758A;
    --grid-line:     #C6D5E3;
    --grid-line-soft:#DCE7F1;
    --fill:          #4A90D9;
    --fill-deep:     #2F72BE;
    --accent:        #FFB447;
    --accent-deep:   #F2932A;
    --accent-ink:    #5A3B0A;
    --panel:         #FFFFFF;
    --header-num:    #8FA3B8;
    --radius-l: 22px;
    --radius-m: 14px;
    --radius-s: 8px;
    --font-display: 'M PLUS Rounded 1c', sans-serif;
    --cell-size: 32px;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg);
    font-family:var(--font-display);
    color:var(--ink);
    overflow:hidden;
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
  }
  body{
    background-image:
      linear-gradient(var(--grid-line-soft) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line-soft) 1px, transparent 1px);
    background-size: 28px 28px;
  }
  button{ font-family:var(--font-display); border:none; cursor:pointer; -webkit-tap-highlight-color:transparent; }

  #app{ position:relative; width:100vw; height:100vh; height:100dvh; }

  .screen{ position:absolute; inset:0; display:flex; flex-direction:column; }
  .screen[hidden]{ display:none; }

  /* =========================================================
   * メニュー画面共通
   * ========================================================= */
  .menu-screen{
    align-items:center; justify-content:center; gap: clamp(18px, 3.4vh, 34px);
    padding: 24px;
    text-align:center;
  }
  .menu-title{
    font-size: clamp(1.5rem, 4.6vh, 2.6rem);
    font-weight:900;
    color:var(--ink);
  }
  .menu-sub{ font-size: clamp(.85rem,2vh,1.05rem); color:var(--ink-soft); font-weight:700; margin-top:-10px; }
  .dan-grid{
    display:grid;
    grid-template-columns: repeat(4, minmax(90px, 120px));
    gap: clamp(10px,1.6vh,18px);
  }
  .dan-btn{
    background:var(--panel);
    border:3px solid var(--grid-line);
    border-radius: var(--radius-m);
    padding: clamp(14px,2.4vh,22px) 4px;
    font-size: clamp(1.3rem,3.6vh,1.9rem);
    font-weight:800;
    color:var(--fill-deep);
    box-shadow: 0 4px 0 var(--grid-line);
    transition: transform .1s;
  }
  .dan-btn:active{ transform:translateY(4px); box-shadow:none; }
  .order-grid{
    display:flex; gap: clamp(12px,2vh,22px); flex-wrap:wrap; justify-content:center;
  }
  .order-btn{
    background:var(--accent);
    color:var(--accent-ink);
    border-radius: var(--radius-l);
    padding: clamp(16px,2.6vh,26px) clamp(24px,4vw,40px);
    font-size: clamp(1.05rem,2.6vh,1.4rem);
    font-weight:800;
    box-shadow: 0 4px 0 var(--accent-deep);
    display:flex; flex-direction:column; align-items:center; gap:6px;
    min-width: 140px;
  }
  .order-btn .icon{ font-size:1.6em; }
  .order-btn:active{ transform:translateY(4px); box-shadow:none; }
  .back-link{
    position:absolute; top: max(14px,2vh); left:20px;
    background:none; color:var(--ink-soft); font-weight:700;
    font-size: clamp(.85rem,2vh,1rem);
    padding:8px 6px;
  }
  .back-link::before{ content:"← "; }
  .selected-dan-badge{
    background:var(--fill); color:#fff; font-weight:800;
    padding: 6px 20px; border-radius:999px;
    font-size: clamp(1rem,2.4vh,1.3rem);
  }

  /* =========================================================
   * 練習画面：ヘッダー
   * ========================================================= */
  #screen-practice{ position:relative; }
  header.app-header{
    position:relative;
    display:flex; justify-content:center;
    padding: max(10px, 1.6vh) 20px 4px;
    flex-shrink:0;
  }
  .header-text{ display:flex; flex-direction:column; align-items:center; gap:2px; }
  .problem-text{
    font-size: clamp(1.3rem, 3.6vh, 2.4rem);
    font-weight:800; letter-spacing:.02em;
  }
  .counter-text{
    font-size: clamp(.95rem, 2.2vh, 1.35rem);
    font-weight:700; color:var(--fill-deep);
  }
  .counter-num{ display:inline-block; min-width:1.6em; }
  .reset-button{
    position:absolute; right:16px; top: max(10px,1.6vh);
    background:var(--panel); color:var(--ink-soft); font-weight:700;
    font-size: clamp(.72rem, 1.6vh, .9rem);
    padding: 8px 14px; border-radius: 999px;
    box-shadow: 0 2px 0 var(--grid-line);
    border: 2px solid var(--grid-line);
    display:flex; align-items:center; gap:6px;
  }
  .reset-button:active{ transform: translateY(2px); box-shadow:none; }
  .reset-button::before{ content:"↺"; font-size:1.1em; }

  /* =========================================================
   * 練習画面：グリッド領域
   * ========================================================= */
  main.grid-stage{
    flex:1; min-height:0; position:relative;
    display:flex; align-items:center; justify-content:center;
    padding: 4px 16px;
  }
  .grid-wrap{ display:grid; grid-template-columns:auto auto; grid-template-rows:auto auto; }
  .col-headers{ display:flex; }
  .row-headers{ display:flex; flex-direction:column; }
  .col-headers .num, .row-headers .num{
    display:flex; align-items:center; justify-content:center;
    color:var(--header-num); font-weight:700;
    font-size: calc(var(--cell-size) * 0.42);
    flex-shrink:0;
  }
  .col-headers .num{ width:var(--cell-size); height: calc(var(--cell-size)*0.62); }
  .row-headers .num{ height:var(--cell-size); width: calc(var(--cell-size)*0.8); }

  #grid{
    position:relative;
    display:grid;
    grid-template-columns: repeat(10, var(--cell-size));
    grid-template-rows: repeat(10, var(--cell-size));
    background:var(--panel);
    border-radius: var(--radius-s);
    box-shadow: 0 6px 18px rgba(43,58,74,0.08);
  }
  #grid.complete-bounce{ animation: gridBounce var(--complete-bounce-ms,520ms) ease; }
  @keyframes gridBounce{
    0%{transform:scale(1);} 35%{transform:scale(1.055);} 60%{transform:scale(.985);} 100%{transform:scale(1);}
  }
  .cell{
    width:var(--cell-size); height:var(--cell-size);
    border-right:1px solid var(--grid-line);
    border-bottom:1px solid var(--grid-line);
    background:transparent;
  }
  .cell.blink{ animation: blinkCell .4s ease 2; }
  @keyframes blinkCell{ 0%,100%{background:rgba(255,180,71,.15);} 50%{background:rgba(255,180,71,.65);} }
  .cell.filled{ background:var(--fill); }
  .cell.filled.pop{ animation: popCell var(--bounce-ms,170ms) ease; z-index:1; }
  @keyframes popCell{ 0%{transform:scale(1);} 45%{transform:scale(1.09); background:var(--fill-deep);} 100%{transform:scale(1);} }

  /* 完成後、グリッド中央に重ねる「つぎへ」オーバーレイ */
  .center-overlay{
    position:absolute; inset:0; z-index:20;
    display:flex; align-items:center; justify-content:center;
    pointer-events:none;
  }
  .center-overlay[hidden]{ display:none; }
  .center-card{
    pointer-events:auto;
    display:flex; flex-direction:column; align-items:center; gap:14px;
    background:rgba(255,255,255,0.94);
    padding: clamp(20px,3vh,30px) clamp(28px,5vw,44px);
    border-radius: var(--radius-l);
    box-shadow: 0 12px 34px rgba(43,58,74,0.28);
    animation: cardIn .22s ease;
  }
  @keyframes cardIn{ from{ transform:scale(.85); opacity:0;} to{ transform:scale(1); opacity:1;} }
  .section-end-text{
    font-weight:800; font-size: clamp(1rem, 2.6vh, 1.5rem); color:var(--accent-deep);
  }
  .next-button{
    background:var(--accent); color:var(--accent-ink); font-weight:800;
    font-size: clamp(1.05rem, 2.6vh, 1.5rem);
    padding: 14px 40px; border-radius: var(--radius-l);
    box-shadow: 0 4px 0 var(--accent-deep);
  }
  .next-button:active{ transform:translateY(3px); box-shadow:none; }

  /* =========================================================
   * 練習画面：フッター（とちゅうでやめる）
   * ========================================================= */
  footer.app-footer{
    flex-shrink:0; display:flex; align-items:center; justify-content:center;
    padding: 8px 22px max(14px, 2.2vh);
  }
  .quit-button{
    background:var(--panel); color:var(--ink-soft); font-weight:700;
    font-size: clamp(.78rem, 1.8vh, .95rem);
    padding: 9px 20px; border-radius: 999px;
    border: 2px solid var(--grid-line);
    box-shadow: 0 2px 0 var(--grid-line);
  }
  .quit-button:active{ transform:translateY(2px); box-shadow:none; }

  /* =========================================================
   * モーダル共通
   * ========================================================= */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(43,58,74,0.45);
    display:flex; align-items:center; justify-content:center; z-index:60;
  }
  .modal-overlay[hidden]{ display:none; }
  .modal-box{
    background:var(--panel); border-radius:var(--radius-l);
    padding: 28px 32px; text-align:center;
    box-shadow: 0 12px 30px rgba(43,58,74,0.25);
    max-width: 80vw;
  }
  .modal-box p{ font-size: clamp(1.05rem,2.6vh,1.4rem); font-weight:700; margin: 0 0 20px; }
  .modal-actions{ display:flex; gap:16px; justify-content:center; }
  .modal-actions button{ font-weight:800; font-size:1.05rem; padding: 10px 26px; border-radius: 999px; }
  .btn-yes{ background:var(--fill); color:#fff; box-shadow:0 3px 0 var(--fill-deep); }
  .btn-yes:active{ transform:translateY(3px); box-shadow:none; }
  .btn-no{ background:#EEF1F5; color:var(--ink-soft); box-shadow:0 3px 0 var(--grid-line); }
  .btn-no:active{ transform:translateY(3px); box-shadow:none; }

  /* =========================================================
   * 回転案内オーバーレイ
   * ========================================================= */
  #rotate-overlay{
    position:fixed; inset:0; background:var(--bg); z-index:80;
    display:none; align-items:center; justify-content:center;
    flex-direction:column; gap:18px; text-align:center; padding:24px;
  }
  #rotate-overlay .icon{ font-size:3.4rem; }
  #rotate-overlay p{ font-size:1.3rem; font-weight:800; margin:0; }
  @media (orientation:portrait){ #rotate-overlay{ display:flex; } }
</style>
</head>
<body>
<div id="app">

  <!-- ============ メニュー：段選択 ============ -->
  <section class="screen menu-screen" id="screen-menu-dan">
    <div class="menu-title">なんの だんに する？</div>
    <div class="menu-sub">すうじを タップしてね</div>
    <div class="dan-grid" id="dan-grid"></div>
  </section>

  <!-- ============ メニュー：順番選択 ============ -->
  <section class="screen menu-screen" id="screen-menu-order" hidden>
    <button class="back-link" id="order-back-btn">だんを えらびなおす</button>
    <div class="selected-dan-badge" id="selected-dan-badge">2のだん</div>
    <div class="menu-title">どの じゅんばんに する？</div>
    <div class="order-grid">
      <button class="order-btn" id="order-asc"><span class="icon">↑</span>じゅんに（1→9）</button>
      <button class="order-btn" id="order-desc"><span class="icon">↓</span>ぎゃくじゅん（9→1）</button>
      <button class="order-btn" id="order-random"><span class="icon">🔀</span>ランダム</button>
    </div>
  </section>

  <!-- ============ 練習画面 ============ -->
  <section class="screen" id="screen-practice" hidden>
    <header class="app-header">
      <div class="header-text">
        <div class="problem-text" id="problem-text">2 × 1 = <span class="q">?</span></div>
        <div class="counter-text">現在：<span class="counter-num" id="counter-num">0</span></div>
      </div>
      <button class="reset-button" id="reset-btn">やりなおす</button>
    </header>

    <main class="grid-stage">
      <div class="grid-wrap">
        <div class="corner"></div>
        <div class="col-headers" id="col-headers"></div>
        <div class="row-headers" id="row-headers"></div>
        <div id="grid"></div>
      </div>

      <div class="center-overlay" id="center-overlay" hidden>
        <div class="center-card">
          <div class="section-end-text" id="section-end-text" hidden></div>
          <button class="next-button" id="next-btn">つぎへ</button>
        </div>
      </div>
    </main>

    <footer class="app-footer">
      <button class="quit-button" id="quit-btn">とちゅうで やめる</button>
    </footer>
  </section>

  <!-- ============ モーダル：やりなおし確認 ============ -->
  <div class="modal-overlay" id="reset-confirm" hidden>
    <div class="modal-box">
      <p>やりなおしますか？</p>
      <div class="modal-actions">
        <button class="btn-no" id="reset-no">いいえ</button>
        <button class="btn-yes" id="reset-yes">はい</button>
      </div>
    </div>
  </div>

  <!-- ============ モーダル：とちゅうでやめる確認 ============ -->
  <div class="modal-overlay" id="quit-confirm" hidden>
    <div class="modal-box">
      <p>メニューに もどりますか？</p>
      <div class="modal-actions">
        <button class="btn-no" id="quit-no">いいえ</button>
        <button class="btn-yes" id="quit-yes">はい</button>
      </div>
    </div>
  </div>

  <div id="rotate-overlay">
    <div class="icon">↻</div>
    <p>たてむきに して ください</p>
  </div>

</div>

<script>
(function(){
  'use strict';

  /* =========================================================
   * 0. 設定値
   * ========================================================= */
  const CONFIG = {
    GRID_SIZE: 10,                      // §改良：2桁以上を扱わないため10×10に縮小
    OUT_OF_GRID_TOLERANCE_MULT: 1.5,
    PITCH_BASE: 420,
    PITCH_STEP: 14,
    PITCH_MAX: 760,
    NOTE_DURATION: 0.11,
    COMPLETE_NOTE_DURATION: 0.42,
    NORMAL_BOUNCE_MS: 170,
    COMPLETE_BOUNCE_MS: 520,
    NORMAL_VIBRATE_MS: 30,
    COMPLETE_VIBRATE_PATTERN: [40, 60, 60],
    RESUME_ROW_TOLERANCE: 1,
    RESUME_COL_TOLERANCE: 1,
    FEEDBACK_TO_COMPLETE_DELAY: 260,
    COMPLETE_TO_ANSWER_DELAY: 620,
    BLINK_DURATION: 800,
  };

  document.documentElement.style.setProperty('--bounce-ms', CONFIG.NORMAL_BOUNCE_MS + 'ms');
  document.documentElement.style.setProperty('--complete-bounce-ms', CONFIG.COMPLETE_BOUNCE_MS + 'ms');

  /* =========================================================
   * 1. 画面切り替え
   * ========================================================= */
  const screens = {
    menuDan:   document.getElementById('screen-menu-dan'),
    menuOrder: document.getElementById('screen-menu-order'),
    practice:  document.getElementById('screen-practice'),
  };
  function showScreen(name){
    Object.values(screens).forEach(s => s.hidden = true);
    screens[name].hidden = false;
  }

  /* =========================================================
   * 2. メニュー：段選択・順番選択
   * ========================================================= */
  let pendingDan = null;

  const danGrid = document.getElementById('dan-grid');
  for (let d = 2; d <= 9; d++){
    const btn = document.createElement('button');
    btn.className = 'dan-btn';
    btn.textContent = d + 'のだん';
    btn.addEventListener('click', () => {
      pendingDan = d;
      document.getElementById('selected-dan-badge').textContent = d + 'のだん';
      showScreen('menuOrder');
    });
    danGrid.appendChild(btn);
  }

  document.getElementById('order-back-btn').addEventListener('click', () => {
    showScreen('menuDan');
  });

  function shuffle(arr){
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function startSession(orderType){
    let cols;
    if (orderType === 'asc')       cols = [1,2,3,4,5,6,7,8,9];
    else if (orderType === 'desc') cols = [9,8,7,6,5,4,3,2,1];
    else                           cols = shuffle([1,2,3,4,5,6,7,8,9]); // §確定：全9問を1回ずつランダム

    session.dan = pendingDan;
    session.order = orderType;
    session.problems = cols.map((c, i) => ({
      rows: pendingDan,
      columns: c,
      dan: pendingDan,
      isLastInDan: i === cols.length - 1,
    }));
    session.index = 0;
    session.active = true;

    showScreen('practice');
    recalcCellSize();
    loadProblem(0);
  }

  document.getElementById('order-asc').addEventListener('click', () => startSession('asc'));
  document.getElementById('order-desc').addEventListener('click', () => startSession('desc'));
  document.getElementById('order-random').addEventListener('click', () => startSession('random'));

  /* =========================================================
   * 3. セッション・問題状態
   * ========================================================= */
  const session = { dan: null, order: null, problems: [], index: 0, active: false };

  const state = {
    phase: 'READY',
    rows: 0,
    columns: 0,
    counter: 0,
    maxReachedRow: 0,
    maxReachedColumn: 0,
    pointerActive: false,
    activePointerId: null,
    eventCount: 0,
    isComplete: false,
  };

  function currentProblem(){ return session.problems[session.index]; }

  function loadProblem(index){
    const p = session.problems[index];
    session.index = index;
    state.phase = 'READY';
    state.rows = p.rows;
    state.columns = p.columns;
    state.counter = 0;
    state.maxReachedRow = 0;
    state.maxReachedColumn = 0;
    state.pointerActive = false;
    state.activePointerId = null;
    state.eventCount = 0;
    state.isComplete = false;
    renderProblemHeader();
    renderGrid();
    renderCounter();
    hideAnswerUI();
  }

  /* =========================================================
   * 4. DOM構築（グリッド10×10）
   * ========================================================= */
  const el = {
    problemText: document.getElementById('problem-text'),
    counterNum: document.getElementById('counter-num'),
    resetBtn: document.getElementById('reset-btn'),
    grid: document.getElementById('grid'),
    colHeaders: document.getElementById('col-headers'),
    rowHeaders: document.getElementById('row-headers'),
    centerOverlay: document.getElementById('center-overlay'),
    nextBtn: document.getElementById('next-btn'),
    sectionEndText: document.getElementById('section-end-text'),
    resetConfirm: document.getElementById('reset-confirm'),
    resetYes: document.getElementById('reset-yes'),
    resetNo: document.getElementById('reset-no'),
    quitBtn: document.getElementById('quit-btn'),
    quitConfirm: document.getElementById('quit-confirm'),
    quitYes: document.getElementById('quit-yes'),
    quitNo: document.getElementById('quit-no'),
  };

  const cellNodes = [];
  (function buildGridDOM(){
    for (let r = 1; r <= CONFIG.GRID_SIZE; r++){
      const rowArr = [];
      for (let c = 1; c <= CONFIG.GRID_SIZE; c++){
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.row = r;
        cell.dataset.col = c;
        el.grid.appendChild(cell);
        rowArr.push(cell);
      }
      cellNodes.push(rowArr);
    }
    for (let c = 1; c <= CONFIG.GRID_SIZE; c++){
      const num = document.createElement('div');
      num.className = 'num'; num.textContent = c;
      el.colHeaders.appendChild(num);
    }
    for (let r = 1; r <= CONFIG.GRID_SIZE; r++){
      const num = document.createElement('div');
      num.className = 'num'; num.textContent = r;
      el.rowHeaders.appendChild(num);
    }
  })();
  function cellAt(row, col){ return cellNodes[row-1][col-1]; }

  /* =========================================================
   * 5. レスポンシブ：セルサイズ計算
   * ========================================================= */
  function recalcCellSize(){
    const stage = document.querySelector('.grid-stage');
    if (!stage) return;
    const rect = stage.getBoundingClientRect();
    if (rect.width === 0 || rect.height === 0) return;
    const rowHeaderW = Math.max(28, rect.width * 0.035);
    const colHeaderH = Math.max(20, rect.height * 0.03);
    const availW = rect.width - rowHeaderW - 32;
    const availH = rect.height - colHeaderH - 16;
    const size = Math.floor(Math.min(availW, availH) / CONFIG.GRID_SIZE);
    document.documentElement.style.setProperty('--cell-size', Math.max(18, size) + 'px');
  }
  window.addEventListener('resize', recalcCellSize);
  window.addEventListener('orientationchange', () => setTimeout(recalcCellSize, 200));

  /* =========================================================
   * 6. 描画
   * ========================================================= */
  function renderProblemHeader(){
    const p = currentProblem();
    el.problemText.innerHTML = `${p.rows} × ${p.columns} = <span class="q">?</span>`;
  }
  function renderCounter(){ el.counterNum.textContent = state.counter; }
  function renderAnswer(){
    const p = currentProblem();
    el.problemText.textContent = `${p.rows} × ${p.columns} ＝ ${p.rows * p.columns}`;
  }
  function hideAnswerUI(){
    el.centerOverlay.hidden = true;
    el.sectionEndText.hidden = true;
    el.sectionEndText.textContent = '';
  }
  function renderGrid(){
    for (let r = 1; r <= CONFIG.GRID_SIZE; r++){
      for (let c = 1; c <= CONFIG.GRID_SIZE; c++){
        cellAt(r, c).classList.remove('filled', 'pop', 'blink');
      }
    }
  }

  /* =========================================================
   * 7. 音（WebAudio）
   * ========================================================= */
  let audioCtx = null;
  function ensureAudio(){
    if (!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  function pitchForEvent(i){ return Math.min(CONFIG.PITCH_MAX, CONFIG.PITCH_BASE + i * CONFIG.PITCH_STEP); }
  function playTone(freq, duration, type){
    const ctx = ensureAudio(); if (!ctx) return;
    const osc = ctx.createOscillator(); const gain = ctx.createGain();
    osc.type = type || 'sine'; osc.frequency.value = freq;
    const now = ctx.currentTime;
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.32, now + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
    osc.connect(gain).connect(ctx.destination);
    osc.start(now); osc.stop(now + duration + 0.02);
  }
  function playNormalSound(){
    state.eventCount += 1;
    playTone(pitchForEvent(state.eventCount), CONFIG.NOTE_DURATION, 'sine');
  }
  function playCompleteSound(){
    playTone(720, CONFIG.COMPLETE_NOTE_DURATION * 0.5, 'triangle');
    setTimeout(() => playTone(960, CONFIG.COMPLETE_NOTE_DURATION * 0.6, 'triangle'), 110);
  }

  /* =========================================================
   * 8. 振動＋バウンド
   * ========================================================= */
  function vibrate(pattern){
    if ('vibrate' in navigator){ try { navigator.vibrate(pattern); } catch(e){} }
  }
  function bounceCells(cells, ms){
    cells.forEach(cell => { cell.classList.remove('pop'); void cell.offsetWidth; cell.classList.add('pop'); });
    setTimeout(() => cells.forEach(c => c.classList.remove('pop')), ms + 30);
  }
  function bounceGridWhole(){
    el.grid.classList.remove('complete-bounce'); void el.grid.offsetWidth;
    el.grid.classList.add('complete-bounce');
    setTimeout(() => el.grid.classList.remove('complete-bounce'), CONFIG.COMPLETE_BOUNCE_MS + 30);
  }
  function normalFeedback(cells){
    playNormalSound(); vibrate(CONFIG.NORMAL_VIBRATE_MS); bounceCells(cells, CONFIG.NORMAL_BOUNCE_MS);
  }
  function completeFeedback(){
    playCompleteSound(); vibrate(CONFIG.COMPLETE_VIBRATE_PATTERN); bounceGridWhole();
  }

  /* =========================================================
   * 9. 幾何：ポインタ→行列
   * ========================================================= */
  function pointerToRowCol(clientX, clientY){
    const rect = el.grid.getBoundingClientRect();
    const cellSize = rect.width / CONFIG.GRID_SIZE;
    const tolerance = cellSize * CONFIG.OUT_OF_GRID_TOLERANCE_MULT;
    const dxOut = clientX < rect.left ? rect.left - clientX : clientX > rect.right ? clientX - rect.right : 0;
    const dyOut = clientY < rect.top ? rect.top - clientY : clientY > rect.bottom ? clientY - rect.bottom : 0;
    if (dxOut > tolerance || dyOut > tolerance) return null;
    let col = Math.floor((clientX - rect.left) / cellSize) + 1;
    let row = Math.floor((clientY - rect.top) / cellSize) + 1;
    col = Math.min(CONFIG.GRID_SIZE, Math.max(1, col));
    row = Math.min(CONFIG.GRID_SIZE, Math.max(1, row));
    return { row, col };
  }

  /* =========================================================
   * 10. 塗り進行ロジック
   * ========================================================= */
  function tryStartFromReady(row, col){
    if (row === 1 && col === 1){
      state.maxReachedRow = 1; state.counter = 1; state.phase = 'VERTICAL';
      cellAt(1,1).classList.add('filled');
      renderCounter();
      normalFeedback([cellAt(1,1)]);
      checkVerticalComplete();
    } else {
      blinkStartCell();
    }
  }
  function blinkStartCell(){
    const c = cellAt(1,1);
    c.classList.remove('blink'); void c.offsetWidth; c.classList.add('blink');
    setTimeout(() => c.classList.remove('blink'), CONFIG.BLINK_DURATION);
  }
  function checkVerticalComplete(){
    if (state.maxReachedRow >= state.rows){
      if (state.columns === 1){ goComplete(); }
      else { state.phase = 'HORIZONTAL'; state.maxReachedColumn = 1; }
    }
  }
  function advanceVertical(hoveredRow){
    while (state.phase === 'VERTICAL' && state.maxReachedRow < state.rows && hoveredRow > state.maxReachedRow){
      state.maxReachedRow += 1;
      state.counter = state.maxReachedRow;
      const cell = cellAt(state.maxReachedRow, 1);
      cell.classList.add('filled');
      renderCounter();
      normalFeedback([cell]);
      checkVerticalComplete();
      if (state.phase !== 'VERTICAL') break;
    }
  }
  function advanceHorizontal(hoveredCol){
    while (state.phase === 'HORIZONTAL' && state.maxReachedColumn < state.columns && hoveredCol > state.maxReachedColumn){
      state.maxReachedColumn += 1;
      state.counter = state.rows * state.maxReachedColumn;
      const cells = [];
      for (let r = 1; r <= state.rows; r++){
        const cell = cellAt(r, state.maxReachedColumn);
        cell.classList.add('filled'); cells.push(cell);
      }
      renderCounter();
      normalFeedback(cells);
      if (state.maxReachedColumn >= state.columns){ goComplete(); break; }
    }
  }
  function goComplete(){
    state.phase = 'COMPLETE_FEEDBACK';
    state.isComplete = true;
    state.pointerActive = false;
    const mySessionToken = session; // クロージャで現セッション参照を保持（とちゅう終了時の誤発火防止）
    setTimeout(() => {
      if (!session.active || session !== mySessionToken) return;
      completeFeedback();
      setTimeout(() => {
        if (!session.active || session !== mySessionToken) return;
        state.phase = 'ANSWER_DISPLAY';
        showAnswerScreen();
      }, CONFIG.COMPLETE_TO_ANSWER_DELAY);
    }, CONFIG.FEEDBACK_TO_COMPLETE_DELAY);
  }
  function showAnswerScreen(){
    renderAnswer();
    const p = currentProblem();
    if (p.isLastInDan){
      el.sectionEndText.hidden = false;
      el.sectionEndText.textContent = `${p.dan}のだん おわり！`;
    }
    el.centerOverlay.hidden = false;
  }

  /* =========================================================
   * 11. ポインタイベント
   * ========================================================= */
  function processPoint(clientX, clientY){
    const rc = pointerToRowCol(clientX, clientY);
    if (!rc) return;
    if (state.phase === 'READY') tryStartFromReady(rc.row, rc.col);
    else if (state.phase === 'VERTICAL') advanceVertical(rc.row);
    else if (state.phase === 'HORIZONTAL') advanceHorizontal(rc.col);
  }
  function handlePointerDownResume(clientX, clientY){
    const rc = pointerToRowCol(clientX, clientY);
    if (!rc) return false;
    if (state.phase === 'VERTICAL'){
      const ok = rc.row >= state.maxReachedRow && rc.row <= state.maxReachedRow + CONFIG.RESUME_ROW_TOLERANCE;
      if (ok) state.pointerActive = true;
      return ok;
    }
    if (state.phase === 'HORIZONTAL'){
      const ok = rc.col >= state.maxReachedColumn && rc.col <= state.maxReachedColumn + CONFIG.RESUME_COL_TOLERANCE;
      if (ok) state.pointerActive = true;
      return ok;
    }
    return false;
  }
  el.grid.addEventListener('pointerdown', (e) => {
    ensureAudio();
    if (state.pointerActive && state.activePointerId !== null && state.activePointerId !== e.pointerId) return;
    if (state.phase === 'READY'){
      state.activePointerId = e.pointerId; state.pointerActive = true;
      processPoint(e.clientX, e.clientY);
    } else if (state.phase === 'VERTICAL' || state.phase === 'HORIZONTAL'){
      if (!state.pointerActive){
        const resumed = handlePointerDownResume(e.clientX, e.clientY);
        if (resumed) state.activePointerId = e.pointerId;
      }
    }
    if (state.pointerActive && state.activePointerId === e.pointerId){
      try { el.grid.setPointerCapture(e.pointerId); } catch(err){}
    }
  });
  el.grid.addEventListener('pointermove', (e) => {
    if (!state.pointerActive || e.pointerId !== state.activePointerId) return;
    if (typeof e.getCoalescedEvents === 'function'){
      const events = e.getCoalescedEvents();
      if (events && events.length){ events.forEach(ev => processPoint(ev.clientX, ev.clientY)); return; }
    }
    processPoint(e.clientX, e.clientY);
  });
  function endPointer(e){
    if (e.pointerId === state.activePointerId){ state.pointerActive = false; state.activePointerId = null; }
  }
  el.grid.addEventListener('pointerup', endPointer);
  el.grid.addEventListener('pointercancel', endPointer);

  /* =========================================================
   * 12. つぎへ／段終了→メニューへ自動復帰
   * ========================================================= */
  el.nextBtn.addEventListener('click', () => {
    const nextIndex = session.index + 1;
    if (nextIndex >= session.problems.length){
      session.active = false;
      showScreen('menuDan'); // §確定：自動でメニューに戻る
      return;
    }
    loadProblem(nextIndex);
  });

  /* =========================================================
   * 13. やりなおし
   * ========================================================= */
  el.resetBtn.addEventListener('click', () => { el.resetConfirm.hidden = false; });
  el.resetNo.addEventListener('click', () => { el.resetConfirm.hidden = true; });
  el.resetYes.addEventListener('click', () => {
    el.resetConfirm.hidden = true;
    loadProblem(session.index);
  });

  /* =========================================================
   * 14. とちゅうで やめる → メニューへ
   * ========================================================= */
  el.quitBtn.addEventListener('click', () => { el.quitConfirm.hidden = false; });
  el.quitNo.addEventListener('click', () => { el.quitConfirm.hidden = true; });
  el.quitYes.addEventListener('click', () => {
    el.quitConfirm.hidden = true;
    session.active = false;
    state.pointerActive = false;
    state.activePointerId = null;
    showScreen('menuDan');
  });

  /* =========================================================
   * 15. 初期化
   * ========================================================= */
  showScreen('menuDan');

})();
</script>
</body>
</html>
