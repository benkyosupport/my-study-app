<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>漢字学習 2年生</title>
<style>
:root {
  --bg: #fdf6ec;
  --card: #fff9f2;
  --ink: #2c1a0e;
  --muted: #8a6a4a;
  --accent: #e85d2f;
  --accent2: #2a7d4f;
  --yellow: #f5c842;
  --shadow: rgba(44,26,14,0.10);
  --radius: 16px;
  --font-kanji: "Hiragino Mincho ProN","Yu Mincho","游明朝",serif;
  --font-ui: "Hiragino Kaku Gothic ProN","Yu Gothic","游ゴシック",sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* ===== HEADER ===== */
header {
  width: 100%;
  max-width: 600px;
  padding: 12px 16px 8px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.back-btn {
  font-size: 13px;
  color: var(--muted);
  text-decoration: none;
  border: 1px solid #d4b896;
  border-radius: 20px;
  padding: 4px 12px;
  background: var(--card);
  white-space: nowrap;
}
.progress-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.progress-label {
  font-size: 12px;
  color: var(--muted);
  text-align: right;
}
.progress-bar-outer {
  height: 6px;
  background: #e4d4c0;
  border-radius: 3px;
  overflow: hidden;
}
.progress-bar-inner {
  height: 100%;
  background: linear-gradient(90deg, var(--accent2), #4caf80);
  border-radius: 3px;
  transition: width 0.5s ease;
  width: 0%;
}
.settings-btn {
  background: none;
  border: none;
  font-size: 22px;
  cursor: pointer;
  padding: 4px 6px;
  color: var(--muted);
}

/* ===== MAIN ===== */
main {
  width: 100%;
  max-width: 600px;
  padding: 6px 16px 24px;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* ===== PRESENT AREA ===== */
.present-area {
  display: flex;
  gap: 12px;
  height: 200px;
}

/* ===== LEFT PANEL (3ゾーン) ===== */
.illust-panel {
  flex: 1;
  background: var(--card);
  border-radius: var(--radius);
  border: 1.5px solid #e4d4c0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  gap: 0;
  padding: 10px 10px 10px;
  box-shadow: 0 2px 8px var(--shadow);
  overflow: hidden;
}

/* ゾーン1: 読みゾーン（常時表示） */
.reading-zone {
  font-size: 18px;
  font-weight: 700;
  color: var(--accent);
  font-family: var(--font-ui);
  letter-spacing: 0.05em;
  text-align: center;
  line-height: 1.2;
  flex-shrink: 0;
}

/* ゾーン2: 例示ゾーン（漢字マスク対象） */
.example-zone {
  font-size: 15px;
  font-weight: 700;
  color: var(--ink);
  text-align: center;
  line-height: 1.4;
  padding: 6px 8px;
  background: linear-gradient(135deg,#ffecd2,#ffe0b8);
  border-radius: 10px;
  width: 100%;
  font-family: var(--font-kanji);
  flex-shrink: 0;
  transition: opacity 0.25s ease;
}
.example-zone .masked {
  color: var(--accent);
  background: rgba(232,93,47,0.12);
  border-radius: 4px;
  padding: 0 2px;
}

/* ゾーン3: 絵文字／イラストゾーン */
.emoji-zone {
  font-size: 44px;
  line-height: 1;
  text-align: center;
  flex-shrink: 0;
  transition: opacity 0.25s ease;
}
.illust-img {
  width: 60px;
  height: 60px;
  object-fit: contain;
  border-radius: 8px;
}

/* バッジ行 */
.badge-row {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  justify-content: center;
  flex-shrink: 0;
}
.bushu-badge {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 10px;
  background: #f0e6d8;
  color: var(--muted);
  font-family: var(--font-kanji);
}
.category-badge {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 10px;
  background: #e8f4ee;
  color: var(--accent2);
}

/* ===== RIGHT PANEL (漢字) ===== */
.kanji-panel {
  flex: 1;
  background: var(--card);
  border-radius: var(--radius);
  border: 1.5px solid #e4d4c0;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 2px 8px var(--shadow);
  position: relative;
  overflow: hidden;
}
.kanji-display {
  font-size: clamp(72px, 20vw, 108px);
  font-family: var(--font-kanji);
  font-weight: 900;
  line-height: 1;
  color: var(--ink);
  transition: opacity 0.45s ease, transform 0.45s ease;
  user-select: none;
  position: relative;
  z-index: 2;
}
.kanji-display.hidden {
  opacity: 0;
  transform: scale(0.82);
}
.kanji-ghost {
  position: absolute;
  inset: 0;
  display: grid;
  grid-template-columns: repeat(4,1fr);
  grid-template-rows: repeat(4,1fr);
  gap: 3px;
  padding: 10px;
  opacity: 0;
  transition: opacity 0.35s ease 0.2s;
  pointer-events: none;
  z-index: 1;
}
.kanji-ghost.visible { opacity: 1; }
.ghost-cell {
  border-radius: 4px;
  background: #f0e6d8;
  animation: ghostPulse 2s ease-in-out infinite;
}
.ghost-cell:nth-child(2n) { animation-delay: 0.4s; }
.ghost-cell:nth-child(3n) { animation-delay: 0.8s; }
@keyframes ghostPulse {
  0%,100% { opacity: 0.6; }
  50% { opacity: 1; }
}

/* ===== MEMORIZE BTN ===== */
.memorize-btn {
  width: 100%;
  padding: 15px;
  font-size: 17px;
  font-family: var(--font-ui);
  font-weight: 700;
  background: linear-gradient(135deg, var(--accent), #c94020);
  color: #fff;
  border: none;
  border-radius: var(--radius);
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(232,93,47,0.35);
  transition: transform 0.12s, box-shadow 0.12s;
  letter-spacing: 0.04em;
}
.memorize-btn:active { transform: scale(0.97); box-shadow: 0 2px 8px rgba(232,93,47,0.25); }
.memorize-btn.hidden { display: none; }

/* ===== CHOICES ===== */
.choices-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.choice-btn {
  padding: 18px 8px;
  font-size: clamp(34px, 10vw, 48px);
  font-family: var(--font-kanji);
  font-weight: 900;
  background: var(--card);
  border: 2px solid #e4d4c0;
  border-radius: var(--radius);
  cursor: pointer;
  box-shadow: 0 2px 8px var(--shadow);
  transition: transform 0.12s, border-color 0.2s, background 0.2s, box-shadow 0.2s;
  color: var(--ink);
  line-height: 1;
}
.choice-btn:active { transform: scale(0.96); }
.choice-btn.correct {
  background: #e8f7ee;
  border-color: var(--accent2);
  color: var(--accent2);
  box-shadow: 0 0 0 3px rgba(42,125,79,0.18);
}
.choice-btn.wrong {
  background: #fde8e4;
  border-color: #e04040;
  color: #e04040;
  box-shadow: 0 0 0 3px rgba(224,64,64,0.15);
  animation: shake 0.35s ease;
}
@keyframes shake {
  0%,100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}
.choices-grid.hidden { display: none; }

/* ===== SLIDE ANIMATION (correct) ===== */
.kanji-slide {
  position: fixed;
  font-family: var(--font-kanji);
  font-weight: 900;
  font-size: 72px;
  color: var(--ink);
  pointer-events: none;
  z-index: 999;
  transition: none;
}

/* ===== SETTINGS OVERLAY ===== */
.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(44,26,14,0.45);
  z-index: 100;
  align-items: flex-end;
  justify-content: center;
}
.overlay.open { display: flex; }
.settings-panel {
  background: var(--card);
  border-radius: 20px 20px 0 0;
  padding: 24px 20px 36px;
  width: 100%;
  max-width: 600px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  box-shadow: 0 -4px 32px rgba(44,26,14,0.18);
}
.settings-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--ink);
}
.settings-row {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.settings-row label { font-size: 13px; color: var(--muted); }
.settings-row input[type="text"] {
  padding: 10px 12px;
  border: 1.5px solid #d4b896;
  border-radius: 10px;
  font-size: 14px;
  font-family: var(--font-ui);
  background: var(--bg);
  color: var(--ink);
}
.settings-row input[type="text"]:focus {
  outline: none;
  border-color: var(--accent);
}
.api-status { font-size: 12px; color: var(--accent2); min-height: 18px; }
.btn-row { display: flex; gap: 10px; }
.settings-btn-action {
  flex: 1;
  padding: 10px;
  border: none;
  border-radius: 10px;
  font-size: 14px;
  font-family: var(--font-ui);
  font-weight: 700;
  cursor: pointer;
}
.btn-save { background: var(--accent); color: #fff; }
.btn-del  { background: #f0e6d8; color: var(--muted); }
.btn-close {
  padding: 12px;
  border: none;
  border-radius: 10px;
  font-size: 14px;
  font-family: var(--font-ui);
  font-weight: 700;
  cursor: pointer;
  background: #f0e6d8;
  color: var(--muted);
}
.btn-reset {
  padding: 12px;
  border: none;
  border-radius: 10px;
  font-size: 14px;
  font-family: var(--font-ui);
  font-weight: 700;
  cursor: pointer;
  background: #fde8e4;
  color: #c03030;
}

/* ===== COMPLETE SCREEN ===== */
.complete-screen {
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  padding: 40px 20px;
  text-align: center;
}
.complete-screen.visible { display: flex; }
.complete-emoji { font-size: 64px; }
.complete-title { font-size: 22px; font-weight: 700; color: var(--ink); }
.complete-sub { font-size: 14px; color: var(--muted); line-height: 1.6; }
.btn-restart {
  padding: 14px 32px;
  border: none;
  border-radius: var(--radius);
  font-size: 16px;
  font-family: var(--font-ui);
  font-weight: 700;
  cursor: pointer;
  background: var(--accent);
  color: #fff;
  box-shadow: 0 4px 16px rgba(232,93,47,0.35);
}

/* ===== MODE TABS ===== */
.mode-tabs {
  width: 100%;
  max-width: 600px;
  display: flex;
  gap: 0;
  padding: 0 16px 0;
  margin-bottom: -4px;
}
.mode-tab {
  flex: 1;
  padding: 9px 8px 12px;
  font-size: 13px;
  font-family: var(--font-ui);
  font-weight: 700;
  background: #ede0d0;
  color: var(--muted);
  border: none;
  cursor: pointer;
  border-radius: 12px 12px 0 0;
  transition: background 0.18s, color 0.18s;
  letter-spacing: 0.03em;
}
.mode-tab.active {
  background: var(--card);
  color: var(--ink);
  box-shadow: 0 -2px 8px var(--shadow);
}
.mode-tab:first-child { margin-right: 3px; }

/* ===== PARTS MODE ===== */
#partsContent { display: none; }
#partsContent.active { display: flex; flex-direction: column; gap: 12px; }

/* パーツパネル：左に漢字ヒント情報、右に漢字表示（通常モードと同レイアウト） */
.parts-present-area {
  display: flex;
  gap: 12px;
  height: 200px;
}

/* 並べ替えエリア */
.parts-sort-area {
  background: var(--card);
  border-radius: var(--radius);
  border: 1.5px solid #e4d4c0;
  box-shadow: 0 2px 8px var(--shadow);
  padding: 10px 12px 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.parts-sort-label {
  font-size: 12px;
  color: var(--muted);
  text-align: center;
  letter-spacing: 0.04em;
}

/* パーツプール（ドラッグ元） */
.parts-pool {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  min-height: 52px;
  padding: 4px;
}

/* ドラッグ可能パーツタイル */
.part-tile {
  font-size: 20px;
  font-family: var(--font-kanji);
  font-weight: 700;
  background: var(--card);
  border: 2px solid #e4d4c0;
  border-radius: 10px;
  padding: 5px 9px;
  cursor: grab;
  box-shadow: 0 2px 6px var(--shadow);
  user-select: none;
  transition: transform 0.12s, box-shadow 0.12s, border-color 0.2s, opacity 0.2s;
  color: var(--ink);
  touch-action: none;
  min-width: 40px;
  text-align: center;
}
.part-tile:active { cursor: grabbing; }
.part-tile.dragging { opacity: 0.35; transform: scale(0.88); }
.part-tile.placed   { opacity: 0.3; pointer-events: none; }

/* 右パネル内グリッド（ドロップ先） */
.parts-drop-grid {
  position: absolute;
  inset: 8px;
  display: grid;
  gap: 4px;
}
/* グリッドセル */
.drop-cell {
  border-radius: 8px;
  background: rgba(228,212,192,0.45);
  border: 2px dashed #c8b090;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s, border-color 0.15s;
  position: relative;
  font-size: 18px;
  font-family: var(--font-kanji);
  font-weight: 700;
}
.drop-cell.drag-over {
  background: rgba(232,93,47,0.12);
  border-color: var(--accent);
}
.drop-cell.filled {
  background: rgba(255,249,242,0.9);
  border: 2px solid #e4d4c0;
}
.drop-cell.correct {
  background: rgba(232,247,238,0.95);
  border-color: var(--accent2);
  color: var(--accent2);
}
.drop-cell.wrong {
  background: rgba(253,232,228,0.95);
  border-color: #e04040;
  color: #e04040;
  animation: shake 0.35s ease;
}
.drop-cell .placed-label {
  font-size: 18px;
  font-family: var(--font-kanji);
  font-weight: 700;
  line-height: 1;
}

/* パーツ確認ボタン */
.parts-check-btn {
  width: 100%;
  padding: 15px;
  font-size: 17px;
  font-family: var(--font-ui);
  font-weight: 700;
  background: linear-gradient(135deg, #2a7d4f, #1d6040);
  color: #fff;
  border: none;
  border-radius: var(--radius);
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(42,125,79,0.30);
  transition: transform 0.12s, box-shadow 0.12s;
  letter-spacing: 0.04em;
}
.parts-check-btn:active { transform: scale(0.97); }
.parts-check-btn.hidden { display: none; }

/* パーツ結果フィードバック */
.parts-feedback {
  text-align: center;
  font-size: 15px;
  font-weight: 700;
  padding: 10px;
  border-radius: 10px;
  display: none;
}
.parts-feedback.ok {
  display: block;
  background: #e8f7ee;
  color: var(--accent2);
}
.parts-feedback.ng {
  display: block;
  background: #fde8e4;
  color: #c03030;
  animation: shake 0.35s ease;
}

/* パーツモード：覚えたボタン（通常と同スタイル） */
.parts-memorize-btn {
  width: 100%;
  padding: 15px;
  font-size: 17px;
  font-family: var(--font-ui);
  font-weight: 700;
  background: linear-gradient(135deg, var(--accent), #c94020);
  color: #fff;
  border: none;
  border-radius: var(--radius);
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(232,93,47,0.35);
  transition: transform 0.12s, box-shadow 0.12s;
  letter-spacing: 0.04em;
}
.parts-memorize-btn:active { transform: scale(0.97); }
.parts-memorize-btn.hidden { display: none; }

/* パーツモード完了画面 */
.parts-complete-screen {
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  padding: 40px 20px;
  text-align: center;
}
.parts-complete-screen.visible { display: flex; }

/* ===== 穴埋めモード ===== */
#fillContent { display: none; }
#fillContent.active { display: flex; flex-direction: column; gap: 12px; }

/* 穴埋め：右パネルの？表示 */
.fill-question-mark {
  font-size: clamp(72px, 20vw, 108px);
  font-family: var(--font-kanji);
  font-weight: 900;
  color: #c8b090;
  line-height: 1;
  user-select: none;
  transition: opacity 0.3s ease, transform 0.3s ease;
}
.fill-kanji-reveal {
  font-size: clamp(72px, 20vw, 108px);
  font-family: var(--font-kanji);
  font-weight: 900;
  color: var(--ink);
  line-height: 1;
  user-select: none;
  display: none;
  animation: popIn 0.35s ease-out;
}
@keyframes popIn {
  0% { transform: scale(0.7); opacity: 0; }
  70% { transform: scale(1.08); }
  100% { transform: scale(1); opacity: 1; }
}

/* 穴（○）スタイル */
.hole {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 1.3em;
  height: 1.3em;
  border: 2px solid #3b82f6;
  border-radius: 6px;
  background-color: #eff6ff;
  color: #3b82f6;
  font-weight: bold;
  margin: 0 2px;
  vertical-align: middle;
  transition: all 0.25s ease;
}
.hole.filled {
  border-color: transparent;
  background-color: transparent;
  color: #1d4ed8;
  animation: popIn 0.3s ease-out;
  font-family: var(--font-kanji);
}

/* 文脈リスト */
.context-list {
  list-style: none;
  padding: 0;
  margin: 0;
  font-size: 1.35rem;
  line-height: 2.1;
  font-family: var(--font-kanji);
  font-weight: 700;
  color: var(--ink);
  text-align: center;
  width: 100%;
}

/* 穴埋め読みゾーン（？マーク） */
.fill-reading-zone {
  font-size: 22px;
  font-weight: 700;
  color: #3b82f6;
  font-family: var(--font-ui);
  letter-spacing: 0.05em;
  text-align: center;
  line-height: 1.2;
  flex-shrink: 0;
}

/* 穴埋め完了画面 */
.fill-complete-screen {
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  padding: 40px 20px;
  text-align: center;
}
.fill-complete-screen.visible { display: flex; }

/* 穴埋めモード 4択ボタン（通常モードと同じgridを流用、IDを分ける） */
#fillChoicesGrid .choice-btn {
  padding: 18px 8px;
}

</style>
</head>
<body>

<header>
  <a class="back-btn" href="index.html">← もどる</a>
  <div class="progress-area">
    <div class="progress-label" id="progressLabel">0 / 160</div>
    <div class="progress-bar-outer">
      <div class="progress-bar-inner" id="progressBar"></div>
    </div>
  </div>
  <button class="settings-btn" id="settingsBtn">⚙️</button>
</header>

<!-- モードタブ -->
<div class="mode-tabs">
  <button class="mode-tab active" id="tabRead">📖 読み覚え</button>
  <button class="mode-tab" id="tabParts">🧩 パーツ組み立て</button>
  <button class="mode-tab" id="tabFill">🔍 穴埋め</button>
</div>

<main>
  <div id="mainContent">
    <div class="present-area">

      <!-- 左パネル：3ゾーン -->
      <div class="illust-panel" id="illustPanel">
        <!-- ゾーン1: 読み（常時表示） -->
        <div class="reading-zone" id="readingZone"></div>
        <!-- ゾーン2: 例示（漢字マスク） -->
        <div class="example-zone" id="exampleZone"></div>
        <!-- ゾーン3: 絵文字／イラスト -->
        <div class="emoji-zone" id="emojiZone"></div>
        <!-- バッジ -->
        <div class="badge-row" id="badgeRow"></div>
      </div>

      <!-- 右パネル：漢字 -->
      <div class="kanji-panel" id="kanjiPanel">
        <div class="kanji-display" id="kanjiDisplay"></div>
        <div class="kanji-ghost" id="kanjiGhost">
          <div class="ghost-cell"></div><div class="ghost-cell"></div>
          <div class="ghost-cell"></div><div class="ghost-cell"></div>
          <div class="ghost-cell"></div><div class="ghost-cell"></div>
          <div class="ghost-cell"></div><div class="ghost-cell"></div>
          <div class="ghost-cell"></div><div class="ghost-cell"></div>
          <div class="ghost-cell"></div><div class="ghost-cell"></div>
          <div class="ghost-cell"></div><div class="ghost-cell"></div>
          <div class="ghost-cell"></div><div class="ghost-cell"></div>
        </div>
      </div>

    </div>

<script>
// =============================================
// 定数・状態
// =============================================
const DATA = (typeof KANJI_DATA_UNIQUE !== "undefined") ? KANJI_DATA_UNIQUE : [];
const STORAGE_KEY = "kanji2_done";
const TTS_KEY_STORAGE = "google_tts_key";

let queue = [];
let currentKanji = null;
let currentChoices = [];
let answered = false;

// =============================================
// TTS
// =============================================
let audioCtx = null;

function unlockAudioContext() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const buf = audioCtx.createBuffer(1, 1, 22050);
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  src.connect(audioCtx.destination);
  src.start(0);
}

async function speakGoogle(reading, apiKey) {
  unlockAudioContext();
  try {
    const res = await fetch(
      `https://texttospeech.googleapis.com/v1/text:synthesize?key=${apiKey}`,
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          input: { text: reading },
          voice: { languageCode: "ja-JP", name: "ja-JP-Neural2-B" },
          audioConfig: { audioEncoding: "MP3" }
        })
      }
    );
    const data = await res.json();
    if (!data.audioContent) throw new Error("no audio");
    const binary = atob(data.audioContent);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    const decoded = await audioCtx.decodeAudioData(bytes.buffer);
    const source = audioCtx.createBufferSource();
    source.buffer = decoded;
    source.connect(audioCtx.destination);
    source.start(0);
  } catch(e) {
    webSpeechSpeak(reading);
  }
}

function webSpeechSpeak(reading) {
  const utter = new SpeechSynthesisUtterance(reading);
  utter.lang = "ja-JP";
  utter.rate = 0.85;
  speechSynthesis.speak(utter);
}

function speak(reading) {
  const apiKey = localStorage.getItem(TTS_KEY_STORAGE);
  if (apiKey) speakGoogle(reading, apiKey);
  else webSpeechSpeak(reading);
}

// =============================================
// 振動
// =============================================
function vibrate(pattern = [30]) {
  if ("vibrate" in navigator) {
    try { navigator.vibrate(pattern); } catch(e) {}
  }
}

// =============================================
// 進捗管理
// =============================================
function getDone() {
  return new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"));
}

function markCorrect(kanji) {
  const done = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
  if (!done.includes(kanji)) {
    done.push(kanji);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(done));
  }
}

function getQueue() {
  const done = getDone();
  const remaining = DATA.filter(k => !done.has(k.kanji));
  return remaining.length > 0 ? remaining : [...DATA];
}

function updateProgressUI() {
  const done = getDone();
  const count = Math.min(done.size, DATA.length);
  const pct = DATA.length > 0 ? (count / DATA.length) * 100 : 0;
  document.getElementById("progressLabel").textContent = `${count} / ${DATA.length}`;
  document.getElementById("progressBar").style.width = pct + "%";
}

// =============================================
// 選択肢生成
// =============================================
function randomKanji(excludes) {
  const excludeSet = new Set(excludes.map(k => k.kanji));
  const pool = DATA.filter(k => !excludeSet.has(k.kanji));
  if (pool.length === 0) return DATA[0];
  return pool[Math.floor(Math.random() * pool.length)];
}

function generateChoices(target) {
  const choices = [target];
  const catMatch = DATA
    .filter(k => k.category === target.category && k.kanji !== target.kanji)
    .sort(() => Math.random() - 0.5)[0]
    || randomKanji(choices);
  choices.push(catMatch);
  const relatedPool = (target.related || [])
    .map(k => DATA.find(d => d.kanji === k))
    .filter(Boolean)
    .sort(() => Math.random() - 0.5);
  choices.push(relatedPool[0] || randomKanji(choices));
  const existing = new Set(choices.map(c => c.kanji));
  const pool2 = relatedPool.slice(1).filter(k => !existing.has(k.kanji));
  choices.push(pool2[0] || randomKanji(choices));
  return choices.sort(() => Math.random() - 0.5);
}

// =============================================
// UI描画
// =============================================

/**
 * meaning文字列中の対象漢字（kanji）をspanでマークアップして返す。
 * マスク時はspanのtextContentを「＿」に置き換える。
 */
function buildExampleHTML(meaning, kanji, masked) {
  // 対象漢字を1文字ずつspan.masked-charに包む
  let html = "";
  for (const ch of meaning) {
    if (ch === kanji) {
      html += masked
        ? `<span class="masked">＿</span>`
        : `<span class="masked-char">${ch}</span>`;
    } else {
      html += ch;
    }
  }
  return html;
}

function renderIllust(k) {
  // ゾーン1: 読み（フリガナのみ抽出）
  const readingZone = document.getElementById("readingZone");
  readingZone.textContent = k.reading;

  // ゾーン2: 例示（対象漢字を通常表示）
  const exampleZone = document.getElementById("exampleZone");
  exampleZone.innerHTML = buildExampleHTML(k.meaning, k.kanji, false);

  // ゾーン3: 絵文字 or 画像
  const emojiZone = document.getElementById("emojiZone");
  if (k.image) {
    emojiZone.innerHTML = `<img class="illust-img" src="${k.image}" alt="${k.meaning}">`;
  } else if (k.emoji) {
    emojiZone.textContent = k.emoji;
  } else {
    emojiZone.textContent = "";
  }

  // バッジ
  const badgeRow = document.getElementById("badgeRow");
  badgeRow.innerHTML = `
    <span class="bushu-badge">部首：${k.bushu}</span>
    <span class="category-badge">${k.category}</span>
  `;
}

/**
 * 「覚えた」押下時に例示ゾーンの対象漢字を「＿」にマスク
 */
function maskExample(k) {
  const exampleZone = document.getElementById("exampleZone");
  exampleZone.innerHTML = buildExampleHTML(k.meaning, k.kanji, true);
}

function renderKanji(k) {
  const disp = document.getElementById("kanjiDisplay");
  disp.textContent = k.kanji;
  disp.classList.remove("hidden");
  document.getElementById("kanjiGhost").classList.remove("visible");
}

function renderChoices(choices) {
  const grid = document.getElementById("choicesGrid");
  grid.innerHTML = "";
  choices.forEach(c => {
    const btn = document.createElement("button");
    btn.className = "choice-btn";
    btn.textContent = c.kanji;
    btn.dataset.kanji = c.kanji;
    btn.addEventListener("click", () => onChoiceClick(btn, c));
    grid.appendChild(btn);
  });
  grid.classList.remove("hidden");
}

// =============================================
// フロー制御
// =============================================
function loadNext() {
  answered = false;
  if (queue.length === 0) {
    queue = getQueue();
  }
  const done = getDone();
  if (done.size >= DATA.length && DATA.length > 0) {
    showComplete();
    return;
  }
  const idx = Math.floor(Math.random() * queue.length);
  currentKanji = queue.splice(idx, 1)[0];
  currentChoices = generateChoices(currentKanji);

  renderIllust(currentKanji);
  renderKanji(currentKanji);
  document.getElementById("memorizeBtn").classList.remove("hidden");
  document.getElementById("choicesGrid").classList.add("hidden");
  document.getElementById("mainContent").style.display = "";
  document.getElementById("completeScreen").classList.remove("visible");

  updateProgressUI();
}

function showComplete() {
  document.getElementById("mainContent").style.display = "none";
  document.getElementById("completeScreen").classList.add("visible");
  updateProgressUI();
}

// =============================================
// イベント：覚えたボタン
// =============================================
document.getElementById("memorizeBtn").addEventListener("click", () => {
  vibrate([30]);
  unlockAudioContext();

  // 右パネル：漢字を消去してゴーストへ
  document.getElementById("kanjiDisplay").classList.add("hidden");
  document.getElementById("kanjiGhost").classList.add("visible");
  document.getElementById("memorizeBtn").classList.add("hidden");

  // 左パネル：例示ゾーンの対象漢字をマスク（読み・絵文字は残る）
  maskExample(currentKanji);

  // 4択表示
  renderChoices(currentChoices);
});

// =============================================
// イベント：選択肢クリック
// =============================================
function onChoiceClick(btn, chosen) {
  if (answered) return;
  answered = true;
  vibrate([30]);
  unlockAudioContext();

  const isCorrect = chosen.kanji === currentKanji.kanji;

  if (isCorrect) {
    btn.classList.add("correct");
    markCorrect(currentKanji.kanji);
    speak(currentKanji.reading);
    animateSlide(btn);
    setTimeout(() => {
      loadNext();
    }, 1100);
  } else {
    btn.classList.add("wrong");
    vibrate([60, 40, 60]);
    const all = document.querySelectorAll(".choice-btn");
    all.forEach(b => {
      if (b.dataset.kanji === currentKanji.kanji) {
        b.classList.add("correct");
      }
    });
    speak(currentKanji.reading);
    setTimeout(() => {
      loadNext();
    }, 1600);
  }
}

// =============================================
// 正解アニメーション（漢字スライド）
// =============================================
function animateSlide(correctBtn) {
  const kanjiPanel = document.getElementById("kanjiPanel");
  const panelRect = kanjiPanel.getBoundingClientRect();
  const btnRect = correctBtn.getBoundingClientRect();

  const el = document.createElement("div");
  el.className = "kanji-slide";
  el.textContent = currentKanji.kanji;
  el.style.left = btnRect.left + btnRect.width / 2 - 36 + "px";
  el.style.top = btnRect.top + btnRect.height / 2 - 36 + "px";
  el.style.fontSize = "72px";
  el.style.opacity = "1";
  document.body.appendChild(el);

  const targetLeft = panelRect.left + panelRect.width / 2 - 36;
  const targetTop = panelRect.top + panelRect.height / 2 - 36;

  requestAnimationFrame(() => {
    el.style.transition = "left 0.5s ease, top 0.5s ease, opacity 0.5s ease, transform 0.5s ease";
    el.style.left = targetLeft + "px";
    el.style.top = targetTop + "px";
    el.style.transform = "scale(1.15)";
  });

  setTimeout(() => {
    el.style.opacity = "0";
    el.style.transform = "scale(0.9)";
  }, 600);

  setTimeout(() => {
    el.remove();
  }, 1100);
}

// =============================================
// 設定パネル
// =============================================
document.getElementById("settingsBtn").addEventListener("click", () => {
  const key = localStorage.getItem(TTS_KEY_STORAGE) || "";
  document.getElementById("apiKeyInput").value = key;
  document.getElementById("apiStatus").textContent = key ? "✅ APIキー設定済み" : "";

document.getElementById("closeSettingsBtn").addEventListener("click", () => {

});

document.getElementById("settingsOverlay").addEventListener("click", (e) => {
  if (e.target === document.getElementById("settingsOverlay")) {
    document.getElementById("settingsOverlay").classList.remove("open");
  }
});

document.getElementById("saveKeyBtn").addEventListener("click", () => {
  const val = document.getElementById("apiKeyInput").value.trim();
  if (val) {
    localStorage.setItem(TTS_KEY_STORAGE, val);
    document.getElementById("apiStatus").textContent = "✅ 保存しました";
  }
});

document.getElementById("clearKeyBtn").addEventListener("click", () => {
  localStorage.removeItem(TTS_KEY_STORAGE);
  document.getElementById("apiKeyInput").value = "";

document.getElementById("resetProgressBtn").addEventListener("click", () => {
  if (confirm("進捗をリセットしますか？")) {
    localStorage.removeItem(STORAGE_KEY);
    queue = [];
    document.getElementById("settingsOverlay").classList.remove("open");
    loadNext();
  }
});

document.getElementById("restartBtn").addEventListener("click", () => {
  localStorage.removeItem(STORAGE_KEY);
  queue = [];
  loadNext();
});

// =============================================
// パーツモード：状態
// =============================================
const PARTS_MAP = (() => {
  const m = new Map();
  if (typeof KANJI_PARTS !== "undefined") {
    KANJI_PARTS.forEach(entry => {
      // parts フィールドが配列のものだけ登録（一部エントリはpartsキーが欠落している）
      if (Array.isArray(entry.parts)) {
        m.set(entry.kanji, entry.parts);
      }
    });
  }
  return m;
})();

// KANJI_PARTS対応漢字のみに絞ったDATA
const PARTS_DATA = DATA.filter(k => PARTS_MAP.has(k.kanji));

const PARTS_STORAGE_KEY = "kanji2_parts_done";
let partsQueue = [];
let partsCurrentKanji = null;
let partsAnswered = false;

// =============================================
// パーツモード：進捗
// =============================================
function partsGetDone() {
  return new Set(JSON.parse(localStorage.getItem(PARTS_STORAGE_KEY) || "[]"));
}
function partsMarkCorrect(kanji) {
  const done = JSON.parse(localStorage.getItem(PARTS_STORAGE_KEY) || "[]");
  if (!done.includes(kanji)) {
    done.push(kanji);
    localStorage.setItem(PARTS_STORAGE_KEY, JSON.stringify(done));
  }
}
function partsGetQueue() {
  const done = partsGetDone();
  const remaining = PARTS_DATA.filter(k => !done.has(k.kanji));
  return remaining.length > 0 ? remaining : [...PARTS_DATA];
}

// =============================================
// パーツモード：左パネル描画（通常モードと共通ロジック）
// =============================================
function partsRenderIllust(k) {
  document.getElementById("partsReadingZone").textContent = k.reading;
  document.getElementById("partsExampleZone").innerHTML = buildExampleHTML(k.meaning, k.kanji, false);
  const ez = document.getElementById("partsEmojiZone");

    ez.innerHTML = `<img class="illust-img" src="${k.image}" alt="${k.meaning}">`;
  } else if (k.emoji) {
    ez.textContent = k.emoji;
  } else {
    ez.textContent = "";
  }
  document.getElementById("partsBadgeRow").innerHTML = `
    <span class="bushu-badge">部首：${k.bushu}</span>
    <span class="category-badge">${k.category}</span>
  `;
}

function partsMaskExample(k) {
  document.getElementById("partsExampleZone").innerHTML = buildExampleHTML(k.meaning, k.kanji, true);
}

// =============================================
// パーツモード：ロード
// =============================================
function partsLoadNext() {
  partsAnswered = false;

  if (partsQueue.length === 0) {
    partsQueue = partsGetQueue();
  }
  const done = partsGetDone();
  if (PARTS_DATA.length > 0 && done.size >= PARTS_DATA.length) {
    partsShowComplete();
    return;
  }

  const idx = Math.floor(Math.random() * partsQueue.length);
  partsCurrentKanji = partsQueue.splice(idx, 1)[0];

  if (!partsCurrentKanji) {
    // PARTS_DATAが空（KANJI_PARTS.jsが読めていない等）
    document.getElementById("partsMemorizeBtn").classList.add("hidden");
    document.getElementById("partsKanjiDisplay").textContent = "⚠";
    document.getElementById("partsReadingZone").textContent = "data/KANJI_PARTS.js が読み込めていません";
    return;
  }

  // 左パネル
  partsRenderIllust(partsCurrentKanji);
  // 右パネル：漢字表示に戻す・古いグリッド除去
  const disp = document.getElementById("partsKanjiDisplay");
  disp.textContent = partsCurrentKanji.kanji;
  disp.classList.remove("hidden");
  const oldGrid = document.querySelector("#partsKanjiPanel .parts-drop-grid");
  if (oldGrid) oldGrid.remove();

  // UI状態リセット
  document.getElementById("partsMemorizeBtn").classList.remove("hidden");
  document.getElementById("partsSortArea").classList.add("hidden");
  document.getElementById("partsCheckBtn").classList.add("hidden");
  document.getElementById("partsFeedback").className = "parts-feedback";
  document.getElementById("partsFeedback").textContent = "";
  document.getElementById("partsCompleteScreen").classList.remove("visible");
}

// =============================================
// パーツモード：グリッド生成ヘルパー
// =============================================

/** パーツ数 → グリッド列数・行数を返す */
function getGridDims(n) {
  if (n <= 2) return { cols: 2, rows: 1 };
  if (n <= 4) return { cols: 2, rows: 2 };
  if (n <= 6) return { cols: 3, rows: 2 };
  return { cols: 3, rows: 3 };
}

/**
 * KANJI_PARTS の parts 配列インデックスを
 * グリッドセルのインデックスにマッピングする。
 * パーツ数がグリッドより少ない場合は中央寄せに配置。
 */
function assignCells(parts, cols, rows) {
  const total = cols * rows;
  const n = parts.length;
  // 余りセル数
  const spare = total - n;
  // 前後に分散（前半を切り捨て寄せ）
  const offset = Math.floor(spare / 2);
  // partIdx → cellIdx
  const map = {};
  parts.forEach((_, i) => { map[i] = offset + i; });
  return map; // partIdx → cellIdx
}

// =============================================
// パーツモード：並べ替えクイズ描画（グリッド版）
// =============================================
let dragSrc = null;          // ドラッグ中タイルのDOM
let dragSrcPartIdx = null;   // ドラッグ中タイルのパーツインデックス

function partsRenderSort(k) {
  const parts = PARTS_MAP.get(k.kanji);
  const { cols, rows } = getGridDims(parts.length);
  const partToCellMap = assignCells(parts, cols, rows); // partIdx → cellIdx

  // ── 右パネルにドロップグリッドを生成 ──
  const panel = document.getElementById("partsKanjiPanel");
  // 既存グリッド除去
  const old = panel.querySelector(".parts-drop-grid");
  if (old) old.remove();
  document.getElementById("partsKanjiDisplay").classList.add("hidden");

  const grid = document.createElement("div");
  grid.className = "parts-drop-grid";
  grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  grid.style.gridTemplateRows    = `repeat(${rows}, 1fr)`;

  const totalCells = cols * rows;
  const cells = [];
  for (let ci = 0; ci < totalCells; ci++) {
    const cell = document.createElement("div");
    cell.className = "drop-cell";
    cell.dataset.cellIdx = ci;
    cell.dataset.filled  = "0";

    // どのパーツインデックスが正解かを逆引き
    const correctPartIdx = Object.entries(partToCellMap).find(([, v]) => v === ci)?.[0];
    if (correctPartIdx !== undefined) {
      cell.dataset.correctPartIdx = correctPartIdx;
    } else {
      // 空きセル（回答不要）
      cell.dataset.correctPartIdx = "";
      cell.style.background = "transparent";
      cell.style.border = "none";
    }

    // dragover / drop（マウス）
    cell.addEventListener("dragover", e => {
      if (cell.dataset.correctPartIdx === "") return;
      e.preventDefault();
      cell.classList.add("drag-over");
    });
    cell.addEventListener("dragleave", () => cell.classList.remove("drag-over"));
    cell.addEventListener("drop", e => {
      e.preventDefault();
      cell.classList.remove("drag-over");
      if (dragSrc === null) return;
      handleDrop(cell, dragSrc);
    });

    grid.appendChild(cell);
    cells.push(cell);
  }
  panel.appendChild(grid);

  // ── 下パネルにパーツプールを生成 ──
  const pool = document.getElementById("partsPool");
  pool.innerHTML = "";
  // シャッフルして表示（見た目のみ。正解インデックスは parts[] の元順）
  const shuffledIdxs = parts.map((_, i) => i).sort(() => Math.random() - 0.5);
  shuffledIdxs.forEach(partIdx => {
    const tile = createPartTile(parts[partIdx], partIdx);
    pool.appendChild(tile);
  });

  document.getElementById("partsSortArea").classList.remove("hidden");
  document.getElementById("partsCheckBtn").classList.add("hidden"); // 自動判定のみ
}

// =============================================
// パーツタイル生成
// =============================================
function createPartTile(char, partIdx) {
  const tile = document.createElement("div");
  tile.className = "part-tile";
  tile.textContent = char;
  tile.draggable = true;
  tile.dataset.char    = char;
  tile.dataset.partIdx = partIdx;

  // マウスドラッグ
  tile.addEventListener("dragstart", e => {
    dragSrc = tile;
    dragSrcPartIdx = parseInt(tile.dataset.partIdx);
    tile.classList.add("dragging");
    e.dataTransfer.effectAllowed = "move";
  });
  tile.addEventListener("dragend", () => {
    tile.classList.remove("dragging");
    dragSrc = null;
    dragSrcPartIdx = null;
  });

  // タッチドラッグ（pointer events）
  let ghost = null;
  tile.addEventListener("pointerdown", e => {
    if (e.pointerType === "mouse") return;
    tile.setPointerCapture(e.pointerId);
    ghost = tile.cloneNode(true);
    Object.assign(ghost.style, {
      position: "fixed", opacity: "0.8", pointerEvents: "none",
      zIndex: "9999", left: (e.clientX - 24) + "px", top: (e.clientY - 24) + "px",
      fontSize: "20px", fontFamily: "var(--font-kanji)", fontWeight: "700",
      background: "var(--card)", border: "2px solid var(--accent)",
      borderRadius: "10px", padding: "5px 9px"
    });
    document.body.appendChild(ghost);
    tile.classList.add("dragging");
    dragSrc = tile;
    dragSrcPartIdx = parseInt(tile.dataset.partIdx);
  });
  tile.addEventListener("pointermove", e => {
    if (!ghost) return;
    ghost.style.left = (e.clientX - 24) + "px";
    ghost.style.top  = (e.clientY - 24) + "px";
  });
  tile.addEventListener("pointerup", e => {
    if (!ghost) return;
    ghost.remove(); ghost = null;
    tile.classList.remove("dragging");
    // 指を離した位置のドロップセルを探す
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const cell = el?.closest(".drop-cell");
    if (cell && cell.dataset.correctPartIdx !== "") {
      handleDrop(cell, tile);
    }
    dragSrc = null;
    dragSrcPartIdx = null;
  });

  return tile;
}

// =============================================
// ドロップ処理（共通）
// =============================================
function handleDrop(cell, tile) {
  // 既にfilled（正解済み）のセルには置けない
  if (cell.dataset.filled === "1") return;

  const partIdx   = parseInt(tile.dataset.partIdx);
  const correctIdx = cell.dataset.correctPartIdx === ""
    ? null
    : parseInt(cell.dataset.correctPartIdx);

  if (correctIdx === null) return; // 空きセル

  const isCorrect = partIdx === correctIdx;

  if (isCorrect) {
    // セルを正解表示に
    cell.dataset.filled = "1";
    cell.classList.add("filled", "correct");
    cell.innerHTML = `<span class="placed-label">${tile.dataset.char}</span>`;
    // タイルをプールから消す（placed状態）
    tile.classList.add("placed");
    tile.style.visibility = "hidden";
    vibrate([20]);
    // 全セル正解チェック
    checkAllCellsDone();
  } else {
    // 不正解フィードバック
    cell.classList.add("wrong");
    vibrate([60, 40, 60]);
    setTimeout(() => cell.classList.remove("wrong"), 400);
  }
}

// =============================================
// 全マス正解チェック
// =============================================
function checkAllCellsDone() {
  const grid = document.querySelector(".parts-drop-grid");
  if (!grid) return;
  // correctPartIdx が空でないセルが全部 filled かチェック
  const required = [...grid.querySelectorAll(".drop-cell")]
    .filter(c => c.dataset.correctPartIdx !== "");
  const allDone = required.every(c => c.dataset.filled === "1");
  if (allDone) {
    const fb = document.getElementById("partsFeedback");
    fb.className = "parts-feedback ok";
    fb.textContent = "✅ 正解！ よくできました！";
    partsMarkCorrect(partsCurrentKanji.kanji);
    speak(partsCurrentKanji.reading);
    setTimeout(() => partsLoadNext(), 1400);
  }
}

// =============================================
// パーツモード：完了
// =============================================
function partsShowComplete() {
  document.getElementById("partsSortArea").classList.add("hidden");
  document.getElementById("partsCheckBtn").classList.add("hidden");
  document.getElementById("partsMemorizeBtn").classList.add("hidden");
  document.getElementById("partsCompleteScreen").classList.add("visible");
}

// =============================================
// パーツモード：イベント
// =============================================
document.getElementById("partsMemorizeBtn").addEventListener("click", () => {
  vibrate([30]);
  unlockAudioContext();
  document.getElementById("partsKanjiDisplay").classList.add("hidden");
  document.getElementById("partsMemorizeBtn").classList.add("hidden");
  partsMaskExample(partsCurrentKanji);
  partsRenderSort(partsCurrentKanji);
});

document.getElementById("partsRestartBtn").addEventListener("click", () => {
  localStorage.removeItem(PARTS_STORAGE_KEY);
  partsQueue = [];
  document.getElementById("partsCompleteScreen").classList.remove("visible");
  partsLoadNext();
});

// =============================================
// 穴埋めモード：状態
// =============================================
const FILL_STORAGE_KEY = "kanji2_fill_done";
let fillQueue = [];
let fillCurrentKanji = null;
let fillAnswered = false;
let fillCurrentChoices = [];

// =============================================
// 穴埋めモード：進捗
// =============================================
function fillGetDone() {
  return new Set(JSON.parse(localStorage.getItem(FILL_STORAGE_KEY) || "[]"));
}
function fillMarkCorrect(kanji) {
  const done = JSON.parse(localStorage.getItem(FILL_STORAGE_KEY) || "[]");
  if (!done.includes(kanji)) {
    done.push(kanji);
    localStorage.setItem(FILL_STORAGE_KEY, JSON.stringify(done));
  }
}
function fillGetQueue() {
  const done = fillGetDone();
  const remaining = DATA.filter(k => !done.has(k.kanji));
  return remaining.length > 0 ? remaining : [...DATA];
}

// =============================================
// 穴埋めモード：文脈HTML生成
// 対象漢字を <span class="hole">○</span> に置換
// =============================================
function buildFillContextHTML(text, kanji) {
  let html = "";
  for (const ch of text) {
    if (ch === kanji) {
      html += `<span class="hole">○</span>`;
    } else {
      html += ch;
    }
  }
  return html;
}

// =============================================
// 穴埋めモード：文脈を正解漢字で埋める
// =============================================
function fillHoles(kanji) {
  document.querySelectorAll("#fillExampleZone .hole").forEach(span => {
    span.textContent = kanji;
    span.classList.add("filled");
  });
}

// =============================================
// 穴埋めモード：左パネル描画
// =============================================
function fillRenderIllust(k) {
  // ゾーン1: ？表示（固定）
  document.getElementById("fillReadingZone").textContent = "？　なんの漢字かな？";

  // ゾーン2: examples配列があれば優先、なければmeaningで代替
  const exampleZone = document.getElementById("fillExampleZone");
  if (Array.isArray(k.examples) && k.examples.length > 0) {
    const ul = document.createElement("ul");
    ul.className = "context-list";
    k.examples.forEach(ex => {
      const li = document.createElement("li");
      li.innerHTML = buildFillContextHTML(ex, k.kanji);
      ul.appendChild(li);
    });
    exampleZone.innerHTML = "";
    exampleZone.appendChild(ul);
  } else {
    // meaningをそのまま使って穴あき表示
    const ul = document.createElement("ul");
    ul.className = "context-list";
    const li = document.createElement("li");
    li.innerHTML = buildFillContextHTML(k.meaning, k.kanji);
    ul.appendChild(li);
    exampleZone.innerHTML = "";
    exampleZone.appendChild(ul);
  }

  // バッジ（カテゴリのみ）
  document.getElementById("fillBadgeRow").innerHTML =
    `<span class="category-badge">${k.category}</span>`;
}

// =============================================
// 穴埋めモード：右パネル初期化（？表示）
// =============================================
function fillResetKanjiPanel() {
  const qm = document.getElementById("fillQuestionMark");
  const reveal = document.getElementById("fillKanjiReveal");
  qm.style.display = "";
  qm.style.opacity = "1";
  reveal.style.display = "none";
  reveal.textContent = "";
}

// =============================================
// 穴埋めモード：正解後に漢字を表示
// =============================================
function fillRevealKanji(k) {
  const qm = document.getElementById("fillQuestionMark");
  const reveal = document.getElementById("fillKanjiReveal");
  qm.style.opacity = "0";
  setTimeout(() => {
    qm.style.display = "none";
    reveal.textContent = k.kanji;
    reveal.style.display = "";
  }, 200);
}

// =============================================
// 穴埋めモード：4択描画
// =============================================
function fillRenderChoices(choices) {
  const grid = document.getElementById("fillChoicesGrid");
  grid.innerHTML = "";
  choices.forEach(c => {
    const btn = document.createElement("button");
    btn.className = "choice-btn";
    btn.textContent = c.kanji;
    btn.dataset.kanji = c.kanji;
    btn.addEventListener("click", () => fillOnChoiceClick(btn, c));
    grid.appendChild(btn);
  });
}

// =============================================
// 穴埋めモード：選択肢クリック
// =============================================
function fillOnChoiceClick(btn, chosen) {
  if (fillAnswered) return;
  fillAnswered = true;
  vibrate([30]);
  unlockAudioContext();

  const isCorrect = chosen.kanji === fillCurrentKanji.kanji;

  if (isCorrect) {
    btn.classList.add("correct");
    fillMarkCorrect(fillCurrentKanji.kanji);
    fillHoles(fillCurrentKanji.kanji);
    fillRevealKanji(fillCurrentKanji);
    speak(fillCurrentKanji.reading);
    // 正解後：読みをゾーン1に表示
    document.getElementById("fillReadingZone").textContent = fillCurrentKanji.reading;
    setTimeout(() => fillLoadNext(), 1400);
  } else {
    btn.classList.add("wrong");
    vibrate([60, 40, 60]);
    // 全ボタンの正解を示す
    document.querySelectorAll("#fillChoicesGrid .choice-btn").forEach(b => {
      if (b.dataset.kanji === fillCurrentKanji.kanji) b.classList.add("correct");
    });
    speak(fillCurrentKanji.reading);
    setTimeout(() => fillLoadNext(), 1800);
  }
}

// =============================================
// 穴埋めモード：次の漢字をロード
// =============================================
function fillLoadNext() {
  fillAnswered = false;

  if (fillQueue.length === 0) {
    fillQueue = fillGetQueue();
  }
  const done = fillGetDone();
  if (done.size >= DATA.length && DATA.length > 0) {
    fillShowComplete();
    return;
  }

  const idx = Math.floor(Math.random() * fillQueue.length);
  fillCurrentKanji = fillQueue.splice(idx, 1)[0];
  fillCurrentChoices = generateChoices(fillCurrentKanji);

  fillRenderIllust(fillCurrentKanji);
  fillResetKanjiPanel();
  fillRenderChoices(fillCurrentChoices);
  document.getElementById("fillCompleteScreen").classList.remove("visible");
}

// =============================================
// 穴埋めモード：完了
// =============================================
function fillShowComplete() {
  document.getElementById("fillCompleteScreen").classList.add("visible");
  document.getElementById("fillChoicesGrid").innerHTML = "";
}

// 穴埋めモード：リスタート
document.getElementById("fillRestartBtn").addEventListener("click", () => {
  localStorage.removeItem(FILL_STORAGE_KEY);
  fillQueue = [];
  fillCurrentKanji = null;
  document.getElementById("fillCompleteScreen").classList.remove("visible");
  fillLoadNext();
});

// =============================================
// タブ切り替え（パーツ関連コード全定義後に登録）
// =============================================
{
  const tabRead     = document.getElementById("tabRead");
  const tabParts    = document.getElementById("tabParts");
  const tabFill     = document.getElementById("tabFill");
  const mainContent  = document.getElementById("mainContent");
  const partsContent = document.getElementById("partsContent");
  const fillContent  = document.getElementById("fillContent");

  function activateTab(active) {
    [tabRead, tabParts, tabFill].forEach(t => t.classList.remove("active"));
    active.classList.add("active");
    mainContent.style.display  = "none";
    partsContent.classList.remove("active");
    fillContent.classList.remove("active");
  }

  tabRead.addEventListener("click", () => {
    activateTab(tabRead);
    mainContent.style.display = "";
  });

  tabParts.addEventListener("click", () => {
    activateTab(tabParts);
    partsContent.classList.add("active");
    if (!partsCurrentKanji) partsLoadNext();
  });

  tabFill.addEventListener("click", () => {
    activateTab(tabFill);
    fillContent.classList.add("active");
    if (!fillCurrentKanji) fillLoadNext();
  });
}

// =============================================
// 起動
// =============================================
if (DATA.length === 0) {
  document.getElementById("mainContent").innerHTML =
    '<p style="padding:40px;color:#c03030;text-align:center;">data/kanji2.js が読み込めませんでした</p>';
} else {
  queue = getQueue();
  loadNext();
}
</script>
