<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>九九学習ツール（完全版）</title>
    <style>
        :root {
            --dot-color: #3498db;
            --box-border-color: #bdc3c7;
            --text-color: #333;
            --accent-color: #e74c3c;
            --bg-color: #f0f2f5;
        }
        body { 
            font-family: "Helvetica Neue", Arial, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start; 
            min-height: 100vh; margin: 0; background-color: var(--bg-color);
            touch-action: manipulation;
        }

        /* APIキー設定エリア */
        .api-key-container {
            margin: 12px 0 4px 0;
            display: flex;
            align-items: center;
            gap: 8px;
            width: 95%;
            max-width: 800px;
            background: white;
            border-radius: 12px;
            padding: 10px 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.07);
            box-sizing: border-box;
        }
        .api-key-label {
            font-size: 13px;
            color: #555;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .api-key-input {
            flex: 1;
            font-size: 13px;
            padding: 6px 10px;
            border: 1.5px solid #ccc;
            border-radius: 8px;
            outline: none;
            font-family: monospace;
            color: #333;
            min-width: 0;
        }
        .api-key-input:focus { border-color: var(--dot-color); }
        .api-key-save {
            padding: 6px 14px;
            font-size: 13px;
            cursor: pointer;
            border: none;
            background: var(--dot-color);
            color: white;
            border-radius: 8px;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .api-status {
            font-size: 12px;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .api-status.ok  { color: #27ae60; }
        .api-status.off { color: #e67e22; }

        /* 段選択メニュー */
        .menu-container { margin: 10px 0; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; width: 95%; }
        .dan-btn {
            padding: 10px 15px; font-size: 16px; cursor: pointer; border: 2px solid var(--dot-color);
            background: white; color: var(--dot-color); border-radius: 10px;
        }
        .dan-btn.active { background: var(--dot-color); color: white; }

        /* モード選択 */
        .mode-container { margin-bottom: 15px; display: flex; gap: 10px; }
        .mode-btn {
            padding: 8px 18px; font-size: 15px; cursor: pointer; border: 2px solid #95a5a6;
            background: white; color: #95a5a6; border-radius: 20px;
        }
        .mode-btn.active { background: #95a5a6; color: white; }

        #card { 
            background: white; padding: 25px; border-radius: 30px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            text-align: center; width: 90%; max-width: 800px; min-height: 520px;
            display: flex; flex-direction: column; justify-content: space-around;
        }

        /* ドッツ表示 */
        #dots-area { display: flex; gap: 12px; margin: 0 auto; justify-content: center; align-content: center; min-height: 200px; flex-wrap: wrap; }
        .dot-box { border: 2px solid var(--box-border-color); border-radius: 10px; padding: 6px; display: grid; gap: 6px; background-color: #fff; }
        .dot { width: 24px; height: 24px; background-color: var(--dot-color); border-radius: 50%; }

        /* 式と読み */
        .formula-row { display: flex; justify-content: center; align-items: center; gap: 20px; }
        .char-group { display: flex; flex-direction: column; align-items: center; min-width: 80px; }
        .char-main { font-size: 75px; font-weight: bold; color: var(--text-color); line-height: 1; margin-bottom: 5px; }
        .char-sub { font-size: 24px; color: #777; height: 30px; }

        /* 答え */
        .answer-row { display: flex; justify-content: center; align-items: center; gap: 20px; min-height: 110px; }
        .answer-main { font-size: 100px; color: var(--accent-color); font-weight: bold; line-height: 1; }
        .answer-sub { font-size: 32px; color: var(--accent-color); }

        .hidden { visibility: hidden; }
        .controls { margin: 20px 0; }
        .next-btn { 
            padding: 18px 80px; font-size: 26px; cursor: pointer; border: none; 
            background: #2ecc71; color: white; border-radius: 50px;
            box-shadow: 0 5px 0 #27ae60;
        }
        .next-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #27ae60; }

        /* ── タブ ── */
        .tab-bar {
            display: flex;
            gap: 0;
            width: 95%;
            max-width: 800px;
            margin: 10px 0 0;
            border-bottom: 2px solid var(--dot-color);
        }
        .tab-btn {
            padding: 9px 28px;
            font-size: 15px;
            cursor: pointer;
            border: 2px solid var(--dot-color);
            border-bottom: none;
            background: white;
            color: var(--dot-color);
            border-radius: 8px 8px 0 0;
            margin-right: 4px;
        }
        .tab-btn.active {
            background: var(--dot-color);
            color: white;
        }

        /* ── 逆引きタブ本体 ── */
        #gyaku-panel {
            display: none;
            width: 90%;
            max-width: 800px;
            background: white;
            border-radius: 0 16px 16px 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 24px 28px 32px;
            margin-bottom: 20px;
        }

        .gyaku-hint {
            font-size: 12px;
            letter-spacing: 0.1em;
            color: #aaa;
            margin-bottom: 18px;
        }

        .gyaku-list {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
        }

        .gyaku-row {
            display: grid;
            grid-template-columns: 120px 36px 56px;
            width: 212px;
            align-items: baseline;
            padding: 9px 0;
            border-bottom: 1px solid #ebebeb;
            cursor: pointer;
        }
        .gyaku-row:last-child { border-bottom: none; }

        .g-expr {
            font-family: 'Courier New', Courier, monospace;
            font-size: 24px;
            color: white; /* hidden: text == bg */
            background: white;
            user-select: none;
        }
        .g-expr.revealed {
            color: #333;
            background: transparent;
        }

        .g-eq {
            font-family: 'Courier New', Courier, monospace;
            font-size: 24px;
            color: #bbb;
            text-align: center;
        }

        .g-ans {
            font-family: 'Courier New', Courier, monospace;
            font-size: 24px;
            font-weight: 700;
            color: var(--accent-color);
            text-align: right;
        }
    </style>
</head>
<body>

<!-- APIキー設定 -->
<div class="api-key-container">
    <span class="api-key-label">Google TTS APIキー：</span>
    <input type="password" id="api-key-input" class="api-key-input" placeholder="AIza...（未入力時はブラウザ音声を使用）">
    <button class="api-key-save" onclick="saveApiKey()">保存</button>
    <span id="api-status" class="api-status off">●ブラウザ音声</span>
</div>

<!-- タブバー -->
<div class="tab-bar">
    <button class="tab-btn active" id="tab-main" onclick="switchTab('main')">九九練習</button>
    <button class="tab-btn" id="tab-gyaku" onclick="switchTab('gyaku')">逆引き</button>
</div>

<!-- 九九練習パネル -->
<div id="main-panel">
<div class="menu-container" id="dan-menu"></div>

<div class="mode-container" id="mode-menu">
    <button id="btn-asc" class="mode-btn active" onclick="setMode('asc')">じゅん</button>
    <button id="btn-desc" class="mode-btn" onclick="setMode('desc')">ぎゃく</button>
    <button id="btn-rand" class="mode-btn" onclick="setMode('rand')">ランダム</button>
</div>

<div id="card">
    <div id="dots-area"></div>
    <div class="formula-row">
        <div class="char-group"><div id="f1" class="char-main"></div><div id="y1" class="char-sub hidden"></div></div>
        <div class="char-main">×</div>
        <div class="char-group"><div id="f2" class="char-main"></div><div id="y2" class="char-sub hidden"></div></div>
        <div class="char-main">＝</div>
    </div>
    <div class="answer-row">
        <div id="ans-main" class="answer-main hidden"></div>
        <div id="ans-sub" class="answer-sub hidden"></div>
    </div>
</div>

<div class="controls">
    <button class="next-btn" onclick="handleNext()">次へ</button>
</div>
</div>

<!-- 逆引きパネル -->
<div id="gyaku-panel">
    <div class="menu-container" id="gyaku-dan-menu"></div>
    <p class="gyaku-hint">式をタップすると読み上げます</p>
    <div class="gyaku-list" id="gyaku-list"></div>
</div>

<script>
    // =====================================================
    // 定数・データ
    // =====================================================
    const yomiMap = {
        1:"いち", 2:"に", 3:"さん", 4:"よん", 5:"ご", 6:"ろく", 7:"なな", 8:"はち", 9:"きゅう",
        10:"じゅう", 12:"じゅうに", 14:"じゅうよん", 15:"じゅうご", 16:"じゅうろく", 18:"じゅうはち",
        20:"にじゅう", 21:"にじゅういち", 24:"にじゅうよん", 25:"にじゅうご", 27:"にじゅうなな", 28:"にじゅうはち",
        30:"さんじゅう", 32:"さんじゅうに", 35:"さんじゅうご", 36:"さんじゅうろく", 40:"よんじゅう", 42:"よんじゅうに",
        45:"よんじゅうご", 48:"よんじゅうはち", 49:"よんじゅうきゅう", 50:"ごじゅう", 54:"ごじゅうよん", 56:"ごじゅうろく",
        63:"ろくじゅうさん", 64:"ろくじゅうよん", 72:"ななじゅうに", 81:"はちじゅういち"
    };

    // =====================================================
    // APIキー管理
    // =====================================================
    const STORAGE_KEY = 'gcloud_tts_api_key';
    let gApiKey = '';
    // 音声キャッシュ（テキスト → AudioBuffer）
    const audioCache = {};

    function loadApiKey() {
        const saved = localStorage.getItem(STORAGE_KEY) || '';
        document.getElementById('api-key-input').value = saved;
        gApiKey = saved;
        updateApiStatus();
    }

    function saveApiKey() {
        const val = document.getElementById('api-key-input').value.trim();
        localStorage.setItem(STORAGE_KEY, val);
        gApiKey = val;
        // キャッシュクリア（新しいキーで再取得）
        Object.keys(audioCache).forEach(k => delete audioCache[k]);
        updateApiStatus();
    }

    function updateApiStatus() {
        const el = document.getElementById('api-status');
        if (gApiKey) {
            el.textContent = '●Google音声';
            el.className = 'api-status ok';
        } else {
            el.textContent = '●ブラウザ音声';
            el.className = 'api-status off';
        }
    }

    // =====================================================
    // 音声再生
    // =====================================================
    let audioCtx = null;

    function getAudioContext() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        return audioCtx;
    }

    function playTap() {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime + 0.1);
        if (navigator.vibrate) navigator.vibrate(15);
    }

    // Google Cloud TTS で AudioBuffer を取得（キャッシュ付き）
    async function fetchGoogleTTS(text) {
        if (audioCache[text]) return audioCache[text];

        const url = `https://texttospeech.googleapis.com/v1/text:synthesize?key=${gApiKey}`;
        const body = {
            input: { text: text },
            voice: {
                languageCode: 'ja-JP',
                name: 'ja-JP-Neural2-B',   // 自然な女性音声（Neural2）
                ssmlGender: 'FEMALE'
            },
            audioConfig: {
                audioEncoding: 'MP3',
                speakingRate: 1.1,
                pitch: 0
            }
        };

        const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });

        if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            console.warn('Google TTS error:', err);
            return null;
        }

        const data = await res.json();
        const base64 = data.audioContent;

        // base64 → ArrayBuffer → AudioBuffer
        const binary = atob(base64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        const ctx = getAudioContext();
        const buf = await ctx.decodeAudioData(bytes.buffer.slice(0));
        audioCache[text] = buf;
        return buf;
    }

    function playAudioBuffer(buf) {
        const ctx = getAudioContext();
        const src = ctx.createBufferSource();
        src.buffer = buf;
        src.connect(ctx.destination);
        src.start();
    }

    function speakBrowser(text) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'ja-JP'; u.rate = 1.1;
        window.speechSynthesis.speak(u);
    }

    async function speak(text) {
        if (gApiKey) {
            try {
                const buf = await fetchGoogleTTS(text);
                if (buf) { playAudioBuffer(buf); return; }
            } catch (e) {
                console.warn('Google TTS 失敗、ブラウザ音声にフォールバック:', e);
            }
        }
        speakBrowser(text);
    }

    // =====================================================
    // ゲームロジック（元のコードをほぼ維持）
    // =====================================================
    let currentDan = 2;
    let currentMode = 'asc';
    let queue = [1,2,3,4,5,6,7,8,9];
    let qIdx = 0;
    let step = 0;

    // 段ボタン作成
    const danMenu = document.getElementById('dan-menu');
    for (let i = 1; i <= 9; i++) {
        const b = document.createElement('button');
        b.innerText = i + 'の段';
        b.className = (i === currentDan) ? 'dan-btn active' : 'dan-btn';
        b.onclick = () => selectDan(i);
        danMenu.appendChild(b);
    }

    function selectDan(n) {
        currentDan = n;
        Array.from(danMenu.children).forEach((btn, idx) => {
            btn.className = (idx + 1 === n) ? 'dan-btn active' : 'dan-btn';
        });
        resetGame();
    }

    function setMode(m) {
        currentMode = m;
        document.getElementById('btn-asc').className = (m === 'asc') ? 'mode-btn active' : 'mode-btn';
        document.getElementById('btn-desc').className = (m === 'desc') ? 'mode-btn active' : 'mode-btn';
        document.getElementById('btn-rand').className = (m === 'rand') ? 'mode-btn active' : 'mode-btn';
        resetGame();
    }

    function resetGame() {
        step = 0; qIdx = 0;
        if (currentMode === 'asc') queue = [1,2,3,4,5,6,7,8,9];
        else if (currentMode === 'desc') queue = [9,8,7,6,5,4,3,2,1];
        else queue = [1,2,3,4,5,6,7,8,9].sort(() => Math.random() - 0.5);
        playTap();
        updateUI();
    }

    function createDots(n1, n2) {
        const area = document.getElementById('dots-area');
        area.innerHTML = '';
        for (let i = 0; i < n2; i++) {
            const box = document.createElement('div');
            box.className = 'dot-box';
            box.style.gridTemplateColumns = '1fr';
            for (let j = 0; j < n1; j++) {
                const d = document.createElement('div');
                d.className = 'dot';
                box.appendChild(d);
            }
            area.appendChild(box);
        }
    }

    function updateUI() {
        const n1 = currentDan;
        const n2 = queue[qIdx];
        const ans = n1 * n2;

        document.getElementById('f1').innerText = n1;
        document.getElementById('y1').innerText = yomiMap[n1] || n1;
        document.getElementById('f2').innerText = n2;
        document.getElementById('y2').innerText = yomiMap[n2] || n2;
        document.getElementById('ans-main').innerText = ans;
        document.getElementById('ans-sub').innerText = yomiMap[ans] || ans;

        if (step === 0) createDots(n1, n2);

        document.getElementById('f1').className = (step >= 1) ? "char-main" : "char-main hidden";
        document.getElementById('f2').className = (step >= 1) ? "char-main" : "char-main hidden";
        document.getElementById('y1').className = (step >= 2) ? "char-sub" : "char-sub hidden";
        document.getElementById('y2').className = (step >= 2) ? "char-sub" : "char-sub hidden";
        document.getElementById('ans-main').className = (step >= 3) ? "answer-main" : "answer-main hidden";
        document.getElementById('ans-sub').className = (step >= 4) ? "answer-sub" : "answer-sub hidden";

        if (step === 2) speak(`${yomiMap[n1] || n1}、${yomiMap[n2] || n2}`);
        if (step === 4) speak(yomiMap[ans] || ans);
    }

    function handleNext() {
        playTap();
        step++;
        if (step > 4) {
            step = 0;
            qIdx++;
            if (qIdx >= 9) {
                qIdx = 0;
                if (currentMode === 'rand') queue.sort(() => Math.random() - 0.5);
            }
        }
        updateUI();
    }

    window.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); handleNext(); }
    });

    // =====================================================
    // 逆引きタブ
    // =====================================================

    // 逆引き専用読み：いち/に/さん/よん/ご/ろく/なな/はち/きゅう 固定
    const YOMI1 = ['','いち','に','さん','よん','ご','ろく','なな','はち','きゅう'];

    function gyakuYomi(n) {
        if (n <= 9) return YOMI1[n];
        const ju   = Math.floor(n / 10);
        const ichi = n % 10;
        const juPart   = ju === 1 ? 'じゅう' : YOMI1[ju] + 'じゅう';
        const ichiPart = ichi === 0 ? '' : YOMI1[ichi];
        return juPart + ichiPart;
    }

    async function gyakuSpeak(n1, n2) {
        const ans  = n1 * n2;
        const text = YOMI1[n1] + '\u3000' + YOMI1[n2] + '\u3000' + gyakuYomi(ans);
        await speak(text);
    }

    let gyakuDan = 2;

    // 逆引き段ボタン生成
    const gyakuDanMenu = document.getElementById('gyaku-dan-menu');
    for (let i = 1; i <= 9; i++) {
        const b = document.createElement('button');
        b.innerText = i + 'の段';
        b.className = (i === gyakuDan) ? 'dan-btn active' : 'dan-btn';
        b.dataset.n = i;
        b.onclick = () => {
            gyakuDan = i;
            Array.from(gyakuDanMenu.children).forEach(btn => {
                btn.className = (+btn.dataset.n === i) ? 'dan-btn active' : 'dan-btn';
            });
            renderGyaku();
        };
        gyakuDanMenu.appendChild(b);
    }

    function renderGyaku() {
        const list = document.getElementById('gyaku-list');
        list.innerHTML = '';
        for (let i = 1; i <= 9; i++) {
            const ans = gyakuDan * i;
            const row = document.createElement('div');
            row.className = 'gyaku-row';

            const expr = document.createElement('span');
            expr.className = 'g-expr';
            expr.textContent = gyakuDan + ' × ' + i;

            const eq = document.createElement('span');
            eq.className = 'g-eq';
            eq.textContent = '＝';

            const ansEl = document.createElement('span');
            ansEl.className = 'g-ans';
            ansEl.textContent = String(ans).padStart(2, '\u2007');

            row.appendChild(expr);
            row.appendChild(eq);
            row.appendChild(ansEl);

            row.addEventListener('click', () => {
                const wasHidden = !expr.classList.contains('revealed');
                expr.classList.toggle('revealed');
                if (wasHidden) {
                    if (navigator.vibrate) navigator.vibrate(15);
                    gyakuSpeak(gyakuDan, i);
                }
            });

            list.appendChild(row);
        }
    }

    // タブ切替
    function switchTab(tab) {
        document.getElementById('tab-main').classList.toggle('active', tab === 'main');
        document.getElementById('tab-gyaku').classList.toggle('active', tab === 'gyaku');
        document.getElementById('main-panel').style.display  = (tab === 'main')  ? '' : 'none';
        document.getElementById('gyaku-panel').style.display = (tab === 'gyaku') ? 'block' : 'none';
    }

    // 起動
    loadApiKey();
    updateUI();
    renderGyaku();
</script>
</body>
</html>
