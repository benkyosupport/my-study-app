<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>漢字選択アプリ</title>
<style>
body {
margin: 0;
font-family: sans-serif;
background: #f5f5f5;
}
#app {
max-width: 900px;
margin: auto;
padding: 20px;
text-align: center; /* ←中央寄せ */
}
/* 問題文 */
#question {
font-size: 2.2rem;
margin-bottom: 20px;
}
.q-line {
margin: 6px 0;
}
.q-line span {
font-size: 1.4rem;
color: #666;
}
/* 選択肢 */
#choices {
display: grid;
grid-template-columns: repeat(3, 1fr);
gap: 15px;
}
.choice-btn {
height: 80px;
border: none;
border-radius: 10px;
background: white;
box-shadow: 0 2px 5px rgba(0,0,0,0.2);
}
.choice-btn span {
font-size: 2.4rem;
}
/* 次へボタン */
#nextBtn {
margin-top: 20px;
padding: 12px 20px;
font-size: 1.2rem;
display: none;
}
</style>
</head>
<body>
<div id="app">
<div id="question"></div>
<div id="choices"></div>
<button id="nextBtn">次の問題へ</button>
</div>
<script>
let data;
let currentSet = 0;
let currentIndex = 0;
let currentQuestion;
fetch('./data/data.json')
.then(res => res.json())
.then(json => {
data = json;
loadQuestion();
});
function loadQuestion() {
const q = data.sets[currentSet].questions[currentIndex];
currentQuestion = q;
renderQuestion(q, false);
// 選択肢シャッフル
const shuffled = [...q.choices].sort(() => Math.random() - 0.5);
const choicesDiv = document.getElementById("choices");
choicesDiv.innerHTML = "";
shuffled.forEach(choice => {
const btn = document.createElement("button");
btn.className = "choice-btn";
btn.innerHTML = `<span>${choice.char}</span>`;
btn.onclick = () => handleAnswer(choice, q);
choicesDiv.appendChild(btn);
});
document.getElementById("nextBtn").style.display = "none";
}
function renderQuestion(q, isCorrect) {
const kanji = q.kanji;
const lines = [
buildLine(q.kun[0], kanji, isCorrect),
...q.on.map(o => buildLine(o, kanji, isCorrect))
];
document.getElementById("question").innerHTML =
lines.map(l => `<div class="q-line">${l}</div>`).join("");
}
function buildLine(item, kanji, isCorrect) {
const word = isCorrect
? item.display.replace("◯", kanji)
: item.display;
return `${word}<span>（${item.text}）</span>`;
}
function handleAnswer(choice, q) {
if (choice.type === "correct") {
showCorrect(q);
} else {
playError();
}
}
function showCorrect(q) {
renderQuestion(q, true); // ←同じ位置で置換
playVoice(q);
document.getElementById("nextBtn").style.display = "block";
}
function playVoice(q) {
const texts = [
q.kun[0].text,
...q.on.map(o => o.text)
];
const utter = new SpeechSynthesisUtterance(texts.join("、"));
speechSynthesis.cancel();
speechSynthesis.speak(utter);
}
function playError() {
const utter = new SpeechSynthesisUtterance("ブー");
speechSynthesis.cancel();
speechSynthesis.speak(utter);
}
document.getElementById("nextBtn").onclick = () => {
currentIndex++;
if (currentIndex >= 10) {
alert("セット終了");
return;
}
loadQuestion();
};
</script>
</body>
</html>
