<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>漢字選択アプリ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500&display=swap" rel="stylesheet">
<style>
body {
margin: 0;
font-family: 'Noto Sans JP', sans-serif;
background: #f5f5f5;
}
.container {
width: 100%;
height: 100vh;
padding: 20px;
box-sizing: border-box;
}
/* セット選択 */
#menu {
display: flex;
flex-wrap: wrap;
gap: 15px;
justify-content: center;
}
.set-btn {
width: 220px;
height: 90px;
font-size: 22px;
border-radius: 12px;
border: none;
}
/* 問題 */
#app {
display: none;
flex-direction: column;
justify-content: space-between;
}
#question {
font-size: 44px;
text-align: center;
line-height: 1.7;
}
#choices {
display: grid;
grid-template-columns: repeat(3, 1fr);
gap: 20px;
}
.choice-btn {
height: 120px;
font-size: 36px;
border-radius: 12px;
border: none;
}
#controls {
display: flex;
justify-content: center;
gap: 20px;
}
.control-btn {
width: 220px;
height: 80px;
font-size: 24px;
border-radius: 12px;
border: none;
}
#nextBtn {
display: none;
}
</style>
</head>
<body>
<div id="menu" class="container"></div>
<div id="app" class="container">
<div id="question"></div>
<div id="choices"></div>
<div id="controls">
<button id="speakBtn" class="control-btn">🔊 よみあげ</button>
<button id="nextBtn" class="control-btn">次の問題へ</button>
</div>
</div>
<script>
let data;
let currentSet = [];
let index = 0;
let currentQuestion = null;
/* 初期ロード */
async function load() {
const res = await fetch("./data/data.json"); // ← 修正済み
data = await res.json();
buildMenu();
}
/* セット一覧生成 */
function buildMenu() {
const menu = document.getElementById("menu");
data.sets.forEach(set => {
const btn = document.createElement("button");
btn.className = "set-btn";
btn.textContent = "セット" + set.id + "（" + set.title + "）";
btn.onclick = () => startSet(set);
menu.appendChild(btn);
});
}
/* セット開始 */
function startSet(set) {
currentSet = set.questions;
index = 0;
document.getElementById("menu").style.display = "none";
document.getElementById("app").style.display = "flex";
showQuestion();
}
/* 問題表示 */
function showQuestion() {
currentQuestion = currentSet[index];
document.getElementById("nextBtn").style.display = "none";
let html = "";
const kun = currentQuestion.kun[0];
html += kun.display + "（" + kun.text + "）<br>";
currentQuestion.on.forEach(o => {
html += o.display + "（" + o.text + "）<br>";
});
document.getElementById("question").innerHTML = html;
const choicesDiv = document.getElementById("choices");
choicesDiv.innerHTML = "";
const shuffled = [...currentQuestion.choices].sort(() => Math.random() - 0.5);
shuffled.forEach(c => {
const btn = document.createElement("button");
btn.className = "choice-btn";
btn.textContent = c.char;
btn.onclick = () => selectAnswer(c);
choicesDiv.appendChild(btn);
});
}
/* 回答処理 */
function selectAnswer(choice) {
if (choice.type === "correct") {
showAnswer();
} else {
playError();
}
}
/* 正解表示 */
function showAnswer() {
let html = "";
const kanji = currentQuestion.kanji;
const kun = currentQuestion.kun[0];
html += kun.display.replace("◯", kanji) + "<br>";
currentQuestion.on.forEach(o => {
html += o.display.replace("◯", kanji) + "<br>";
});
document.getElementById("question").innerHTML = html;
document.getElementById("nextBtn").style.display = "inline-block";
playCorrect();
speakAll();
}
/* 次へ */
document.getElementById("nextBtn").onclick = () => {
index++;
if (index >= currentSet.length) {
location.reload();
} else {
showQuestion();
}
};
/* 音声 */
function speakAll() {
const texts = [
currentQuestion.kun[0].text,
...currentQuestion.on.map(o => o.text)
];
let i = 0;
function speakNext() {
if (i >= texts.length) return;
const uttr = new SpeechSynthesisUtterance(texts[i]);
uttr.lang = "ja-JP";
uttr.onend = () => {
i++;
speakNext();
};
speechSynthesis.speak(uttr);
}
speechSynthesis.cancel();
speakNext();
}
/* 手動再生 */
document.getElementById("speakBtn").onclick = () => {
speakAll();
};
/* エラー音 */
function playError() {
const ctx = new AudioContext();
const o = ctx.createOscillator();
o.type = "sawtooth";
o.frequency.setValueAtTime(120, ctx.currentTime);
o.connect(ctx.destination);
o.start();
o.stop(ctx.currentTime + 0.2);
}
/* 正解時 */
function playCorrect() {
if (navigator.vibrate) navigator.vibrate(100);
}
/* 起動 */
load();
</script>
</body>
</html>
