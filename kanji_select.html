<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>漢字選択モード</title>

<style>
body { margin:0; font-family:sans-serif; background:#f5f5f5; }

.topbar {
  padding:10px;
  background:#fff;
  display:flex;
  justify-content:space-between;
}

.container {
  display:flex;
  flex-direction:column;
  height:calc(100vh - 50px);
}

/* 上段 */
.top {
  padding:16px 10px 6px;
  display:flex;
  flex-direction:column;
  align-items:center;
  font-size:34px;
  gap:8px;
}

/* 下段 */
.bottom {
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* グリッド */
.grid {
  display:grid;
  gap:10px;
  width:92%;
  max-width:420px;
  margin-top:4px;
}

/* 選択肢 */
.choice {
  background:#fff;
  border-radius:12px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:64px;
  height:90px;
  cursor:pointer;
  transition:0.12s;
}

.choice:active { transform:scale(0.95); }

.correct { background:#c8f7c5 !important; }
.wrong { background:#ffd6d6 !important; }
.hint { outline:4px solid #6ecbff; }

.fade-in {
  animation:fadeIn 0.25s ease;
}
@keyframes fadeIn {
  from { opacity:0; transform:translateY(5px); }
  to { opacity:1; transform:translateY(0); }
}

.highlight { background:yellow; }

.next-btn {
  margin-top:10px;
  padding:10px 24px;
  font-size:18px;
  background:#4caf50;
  color:#fff;
  border:none;
  border-radius:8px;
  display:none;
}
</style>
</head>

<body>

<div class="topbar">
  <div>
    <select id="modeSelect">
      <option value="4">4択</option>
      <option value="6">6択</option>
    </select>
  </div>
  <div id="reviewInfo">復習:0</div>
</div>

<div class="container">
  <div class="top" id="question"></div>

  <div class="bottom">
    <div class="grid" id="choices"></div>
    <button id="nextBtn" class="next-btn">次へ</button>
  </div>
</div>

<!-- ★先にデータ -->
<script src="data/kanji_select_data.js"></script>

<script>
if(!window.KANJI_SELECT_DATA){
  alert("データ読み込み失敗");
  throw new Error("DATA LOAD ERROR");
}

const DATA = window.KANJI_SELECT_DATA;

let current, wrongCount=0, reviewQueue=[];

function splitWord(str){
  const m=str.match(/(.+?)（(.+?)）/);
  return {text:m[1],reading:m[2]};
}

function mask(w,k){ return w.replaceAll(k,"○"); }
function shuffle(a){ return a.sort(()=>Math.random()-0.5); }

function speak(list){
  if(!list.length) return;
  const u=new SpeechSynthesisUtterance(list.shift());
  u.lang="ja-JP";
  u.onend=()=>speak(list);
  speechSynthesis.speak(u);
}

function render(show=false){
  const q=document.getElementById("question");
  q.innerHTML="";

  const on=splitWord(current.on);
  const kun=current.kun?splitWord(current.kun):null;

  function line(text,reading){
    const d=document.createElement("div");
    d.classList.add("fade-in");

    const t=document.createElement("span");
    t.textContent=text;

    const r=document.createElement("span");
    r.textContent="（"+reading+"）";

    d.appendChild(t);
    d.appendChild(r);

    return {d,r};
  }

  const arr=[];

  if(kun){
    const el=line(show?kun.text:mask(kun.text,current.kanji),kun.reading);
    q.appendChild(el.d);
    arr.push(el);
  }

  const el2=line(show?on.text:mask(on.text,current.kanji),on.reading);
  q.appendChild(el2.d);
  arr.push(el2);

  return {on,kun,arr};
}

function newQuestion(){
  wrongCount=0;
  nextBtn.style.display="none";

  current = reviewQueue.length
    ? reviewQueue.shift()
    : DATA[Math.floor(Math.random()*DATA.length)];

  reviewInfo.textContent="復習:"+reviewQueue.length;

  const {on,kun}=render(false);

  const count=parseInt(modeSelect.value);

  const pool=DATA.map(x=>x.kanji).filter(k=>k!==current.kanji);
  const choices=shuffle([current.kanji,...shuffle(pool).slice(0,count-1)]);

  choicesEl.innerHTML="";
  choicesEl.style.gridTemplateColumns =
    count===6 ? "repeat(3,1fr)" : "repeat(2,1fr)";

  choices.forEach(k=>{
    const b=document.createElement("div");
    b.className="choice";
    b.textContent=k;
    b.onclick=()=>select(b,k,on,kun);
    choicesEl.appendChild(b);
  });
}

function select(btn,k,on,kun){
  if(k===current.kanji){
    btn.classList.add("correct");
    navigator.vibrate?.(50);

    const r=render(true);

    r.arr.forEach(e=>{
      e.r.classList.add("highlight");
      setTimeout(()=>e.r.classList.remove("highlight"),600);
    });

    const list=[];
    if(kun) list.push(kun.reading);
    list.push(on.reading);

    speechSynthesis.cancel();
    speak(list);

    nextBtn.style.display="block";
  }else{
    wrongCount++;
    navigator.vibrate?.([10,40,10]);

    btn.classList.add("wrong");
    setTimeout(()=>btn.classList.remove("wrong"),250);

    if(!reviewQueue.includes(current)){
      reviewQueue.push(current);
    }

    if(wrongCount>=2){
      document.querySelectorAll(".choice").forEach(b=>{
        if(b.textContent===current.kanji) b.classList.add("hint");
      });
    }

    if(wrongCount>=3){
      document.querySelectorAll(".choice").forEach(b=>{
        if(b.textContent!==current.kanji && Math.random()<0.5){
          b.style.display="none";
        }
      });
    }
  }
}

nextBtn.onclick=newQuestion;
modeSelect.onchange=newQuestion;

const nextBtn=document.getElementById("nextBtn");
const choicesEl=document.getElementById("choices");
const reviewInfo=document.getElementById("reviewInfo");
const modeSelect=document.getElementById("modeSelect");

newQuestion();
</script>

</body>
</html>
