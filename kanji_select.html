<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>漢字選択アプリ</title>
<style>
body {
margin: 0;
font-family: sans-serif;
background: #f5f5f5;
}
#app {
max-width: 900px;
margin: auto;
padding: 20px;
text-align: center;
}
/* ===== メニュー ===== */
#menu {
display: flex;
flex-wrap: wrap;
gap: 10px;
justify-content: center;
}
#menu button {
padding: 12px 16px;
font-size: 1rem;
}
/* ===== 問題 ===== */
#question {
font-size: 2.2rem;
margin: 20px 0;
}
.q-line {
margin: 8px 0;
}
.q-line span {
font-size: 1.4rem;
color: #666;
}
/* ===== 選択肢 ===== */
#choices {
display: grid;
grid-template-columns: repeat(3, 1fr);
gap: 15px;
}
.choice-btn {
height: 80px;
border: none;
border-radius: 10px;
background: white;
box-shadow: 0 2px 5px rgba(0,0,0,0.2);
}
.choice-btn span {
font-size: 2.4rem;
}
/* ===== 次へ ===== */
#nextBtn {
margin-top: 20px;
padding: 12px 20px;
font-size: 1.2rem;
display: none;
}
</style>
</head>
<body>
<div id="app">
<div id="menu"></div>
<div id="question"></div>
<div id="choices"></div>
<button id="nextBtn">次の問題へ</button>
</div>
<script>
let data;
let currentSet = 0;
let currentIndex = 0;
/* ===== 初期ロード ===== */
fetch('./data/data.json')
.then(res => res.json())
.then(json => {
data = json;
initMenu();
})
.catch(err => {
alert("JSON読み込みエラー");
console.error(err);
});
/* ===== メニュー生成 ===== */
function initMenu() {
const menu = document.getElementById("menu");
menu.innerHTML = "";
data.sets.forEach((set, index) => {
const btn = document.createElement("button");
btn.textContent = `セット${index + 1}（${set.title}）`;
btn.onclick = () => startSet(index);
menu.appendChild(btn);
});
}
/* ===== セット開始 ===== */
function startSet(index) {
currentSet = index;
currentIndex = 0;
document.getElementById("menu").style.display = "none";
loadQuestion();
}
/* ===== 問題ロード ===== */
function loadQuestion() {
const q = data.sets[currentSet].questions[currentIndex];
renderQuestion(q, false);
const shuffled = [...q.choices].sort(() => Math.random() - 0.5);
const choicesDiv = document.getElementById("choices");
choicesDiv.innerHTML = "";
shuffled.forEach(choice => {
const btn = document.createElement("button");
btn.className = "choice-btn";
btn.innerHTML = `<span>${choice.char}</span>`;
btn.onclick = () => handleAnswer(choice, q);
choicesDiv.appendChild(btn);
});
document.getElementById("nextBtn").style.display = "none";
}
/* ===== 問題表示 ===== */
function renderQuestion(q, isCorrect) {
const kanji = q.kanji;
const lines = [
buildLine(q.kun[0], kanji, isCorrect),
...q.on.map(o => buildLine(o, kanji, isCorrect))
];
document.getElementById("question").innerHTML =
lines.map(l => `<div class="q-line">${l}</div>`).join("");
}
function buildLine(item, kanji, isCorrect) {
const word = isCorrect
? item.display.replace("◯", kanji)
: item.display;
return `${word}<span>（${item.text}）</span>`;
}
/* ===== 回答処理 ===== */
function handleAnswer(choice, q) {
if (choice.type === "correct") {
showCorrect(q);
} else {
playError();
}
}
/* ===== 正解 ===== */
function showCorrect(q) {
renderQuestion(q, true);
playVoice(q);
document.getElementById("nextBtn").style.display = "block";
}
/* ===== 音声 ===== */
function playVoice(q) {
const texts = [
q.kun[0].text,
...q.on.map(o => o.text)
];
const utter = new SpeechSynthesisUtterance(texts.join("、"));
speechSynthesis.cancel();
speechSynthesis.speak(utter);
}
function playError() {
const utter = new SpeechSynthesisUtterance("ブー");
speechSynthesis.cancel();
speechSynthesis.speak(utter);
}
/* ===== 次へ ===== */
document.getElementById("nextBtn").onclick = () => {
currentIndex++;
if (currentIndex >= 10) {
alert("セット終了");
location.reload(); // メニューに戻る
return;
}
loadQuestion();
};
</script>
</body>
</html>
