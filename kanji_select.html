<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>漢字選択モード（最適化版）</title>

<style>
body { margin:0; font-family:sans-serif; background:#f5f5f5; }

.topbar {
  padding:10px;
  background:#fff;
  display:flex;
  justify-content:space-between;
}

.container {
  display:flex;
  flex-direction:column;
  height:calc(100vh - 50px);
}

.top {
  padding:20px 10px 10px;
  display:flex;
  flex-direction:column;
  align-items:center;
  font-size:36px;
  gap:12px;
}

.bottom {
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
}

.grid {
  display:grid;
  gap:12px;
  width:90%;
  max-width:420px;
  margin-top:6px;
}

.choice {
  background:#fff;
  border-radius:14px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:64px;
  height:96px;
  cursor:pointer;
  transition:0.15s;
}

.choice:active { transform:scale(0.95); }

.correct { background:#c8f7c5 !important; }
.wrong { background:#ffd6d6 !important; }
.hint { outline:4px solid #a0e0ff; }

.fade-in {
  animation:fadeIn 0.35s ease;
}
@keyframes fadeIn {
  from { opacity:0; transform:translateY(6px); }
  to { opacity:1; transform:translateY(0); }
}

.highlight {
  background:yellow;
}

.next-btn {
  margin-top:14px;
  padding:12px 28px;
  font-size:18px;
  background:#4caf50;
  color:#fff;
  border:none;
  border-radius:8px;
  display:none;
}
</style>
</head>

<body>

<div class="topbar">
  <div>
    モード:
    <select id="modeSelect">
      <option value="4">4択</option>
      <option value="6">6択</option>
    </select>
  </div>
  <div id="reviewInfo">復習キュー: 0</div>
</div>

<div class="container">
  <div class="top" id="question"></div>

  <div class="bottom">
    <div class="grid" id="choices"></div>
    <button class="next-btn" id="nextBtn">次へ</button>
  </div>
</div>

<!-- ★ 修正済み：dataフォルダ参照 -->
<script src="data/kanji_select_data.js"></script>

<script>
if(!window.KANJI_SELECT_DATA || !KANJI_SELECT_DATA.length){
  alert("データ読み込み失敗：data/kanji_select_data.js を確認");
}

let current, wrongCount=0, reviewQueue=[];

function splitWord(str){
  const m=str.match(/(.+?)（(.+?)）/);
  return {text:m[1],reading:m[2]};
}

function mask(w,k){ return w.replaceAll(k,"○"); }
function shuffle(a){ return a.sort(()=>Math.random()-0.5); }

function speakSequence(list){
  if(!list.length) return;
  const u=new SpeechSynthesisUtterance(list.shift());
  u.lang="ja-JP";
  u.rate=0.9;
  u.onend=()=>speakSequence(list);
  speechSynthesis.speak(u);
}

function renderQuestion(show=false){
  const q=document.getElementById("question");
  q.innerHTML="";

  const on=splitWord(current.on);
  const kun=current.kun?splitWord(current.kun):null;

  function line(text,reading){
    const d=document.createElement("div");
    d.classList.add("fade-in");

    const t=document.createElement("span");
    t.textContent=text;

    const r=document.createElement("span");
    r.textContent="（"+reading+"）";

    d.appendChild(t);
    d.appendChild(r);

    return {d,r};
  }

  const elements=[];

  if(kun){
    const el=line(show?kun.text:mask(kun.text,current.kanji),kun.reading);
    q.appendChild(el.d);
    elements.push(el);
  }

  const el2=line(show?on.text:mask(on.text,current.kanji),on.reading);
  q.appendChild(el2.d);
  elements.push(el2);

  return {on,kun,elements};
}

function newQuestion(){
  wrongCount=0;
  document.getElementById("nextBtn").style.display="none";

  current = reviewQueue.length
    ? reviewQueue.shift()
    : KANJI_SELECT_DATA[Math.floor(Math.random()*KANJI_SELECT_DATA.length)];

  updateReviewInfo();

  const {on,kun}=renderQuestion(false);

  const count=parseInt(document.getElementById("modeSelect").value);

  const pool = KANJI_SELECT_DATA
    .map(x=>x.kanji)
    .filter(k=>k!==current.kanji);

  const choices=shuffle([current.kanji,...shuffle(pool).slice(0,count-1)]);

  const grid=document.getElementById("choices");
  grid.innerHTML="";
  grid.style.gridTemplateColumns = count===6 ? "repeat(3,1fr)" : "repeat(2,1fr)";

  choices.forEach(k=>{
    const btn=document.createElement("div");
    btn.className="choice";
    btn.textContent=k;
    btn.onclick=()=>handleChoice(btn,k,on,kun);
    grid.appendChild(btn);
  });
}

function handleChoice(btn,k,on,kun){

  if(k===current.kanji){

    btn.classList.add("correct");
    navigator.vibrate?.(50);

    const result=renderQuestion(true);

    result.elements.forEach(el=>{
      el.r.classList.add("highlight");
      setTimeout(()=>el.r.classList.remove("highlight"),600);
    });

    const list=[];
    if(kun) list.push(kun.reading);
    list.push(on.reading);

    speechSynthesis.cancel();
    speakSequence(list);

    document.getElementById("nextBtn").style.display="block";

  }else{

    wrongCount++;
    navigator.vibrate?.([10,40,10]);

    btn.classList.add("wrong");
    setTimeout(()=>btn.classList.remove("wrong"),300);

    if(!reviewQueue.includes(current)){
      reviewQueue.push(current);
    }

    if(wrongCount>=2) highlightHint();
    if(wrongCount>=3) reduceChoices();
  }
}

function highlightHint(){
  document.querySelectorAll(".choice").forEach(btn=>{
    if(btn.textContent===current.kanji){
      btn.classList.add("hint");
    }
  });
}

function reduceChoices(){
  document.querySelectorAll(".choice").forEach(btn=>{
    if(btn.textContent!==current.kanji && Math.random()<0.5){
      btn.style.display="none";
    }
  });
}

function updateReviewInfo(){
  document.getElementById("reviewInfo").textContent =
    "復習キュー: "+reviewQueue.length;
}

document.getElementById("nextBtn").onclick=newQuestion;
document.getElementById("modeSelect").onchange=newQuestion;

newQuestion();
</script>

</body>
</html>
